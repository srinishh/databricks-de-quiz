 e:"REVOKE removes a previously granted privilege from a user, group or service principal."},
{s:"a_gov",q:"What does DENY do?",
 o:["Explicitly blocks a privilege, even if it would otherwise be granted or inherited","Deletes a user","Hides a table from lineage","Pauses a job"],
 e:"DENY takes precedence over grants, so it is useful for blocking access that would otherwise come through a group or inheritance."},
{s:"a_gov",q:"Which principal should run production jobs rather than a person's own account?",
 o:["A service principal","The workspace admin","A shared personal account","The cluster driver"],
 e:"Service principals are identities for automation. They avoid breaking jobs when a person leaves and make access easier to audit and limit."},
{s:"a_gov",q:"Which feature hides most digits of a card number for non-finance users while keeping the column queryable?",
 o:["A column mask","A row filter","A cluster policy","A table comment"],
 e:"A column mask applies a function to a column's values depending on who is querying, while row filters hide whole rows."},
{s:"a_gov",q:"What does an ABAC policy use to decide which rows or columns to protect?",
 o:["Governed tags applied to tables and columns","The name of the cluster","The size of the table","The query's run time"],
 e:"Attribute-based policies match governed tags, so one policy covers every table or column carrying the tag."},
{s:"a_gov",q:"A team must read every table in one schema. At which level should you grant SELECT?",
 o:["On the schema, so it inherits to its tables","On each table separately","On the metastore only","On the cluster"],
 e:"Privileges inherit down the hierarchy, so granting on the schema covers its existing and future tables. Grant at the lowest level that still meets the need."},
/* ---- Apache Spark: architecture and execution ---- */
{s:"sp_arch",q:"When does Spark actually run the work described by a chain of DataFrame transformations?",
 o:["When an action such as count(), collect() or a write is called","As soon as each transformation is defined","When the SparkSession is created","When the schema of the DataFrame is printed"],
 e:"Transformations are lazy: they only build a logical plan. An action asks for a result, which makes Spark optimize the whole plan and launch jobs."},
{s:"sp_arch",q:"Which operation introduces a stage boundary in a Spark job?",
 o:["A groupBy aggregation, because rows with the same key must be shuffled together","A filter on a column, because Spark must check every partition before the next step can start","Selecting a subset of columns, because the dropped columns are removed in a separate stage","Adding a column with withColumn, because each new column is computed by its own set of tasks"],
 e:"Wide transformations such as groupBy, join on unpartitioned data or repartition need a shuffle, and every shuffle splits the job into a new stage. Narrow transformations are pipelined inside one stage."},
{s:"sp_arch",q:"Which component turns a job into stages and tasks and schedules those tasks on executors?",
 o:["The driver","Each executor","The cluster manager","The external shuffle service"],
 e:"The driver holds the SparkSession, builds and optimizes the plan, splits it into stages (DAG scheduler) and sends tasks to executors (task scheduler). The cluster manager only allocates resources."},
{s:"sp_arch",q:"How many tasks does Spark launch for one stage?",
 o:["One task per partition of the data that stage processes","One task per executor","One task per core in the cluster, regardless of data","One task per column"],
 e:"A task is the unit of work for one partition. A stage reading 400 partitions runs 400 tasks, as many at a time as there are free task slots."},
{s:"sp_arch",q:"What is the cluster manager's job in a Spark application?",
 o:["Allocating resources such as executor containers or pods to the application","Optimizing the logical plan and choosing join strategies before tasks are sent out","Storing shuffle files so that reducers can fetch them from a central place","Splitting each job into stages and deciding which task runs on which partition"],
 e:"Standalone, YARN and Kubernetes cluster managers hand out resources. Planning and scheduling of tasks stay with the driver."},
{s:"sp_arch",q:"In client deploy mode, where does the driver process run?",
 o:["On the machine that submitted the application","On a worker node chosen by the cluster manager","Inside every executor","On the external shuffle service host"],
 e:"Client mode keeps the driver in the submitting process, which is common for notebooks and shells. Cluster mode launches the driver inside the cluster."},
{s:"sp_arch",q:"Which Catalyst phase resolves table and column names against the catalog?",
 o:["Analysis","Logical optimization","Physical planning","Whole-stage code generation"],
 e:"The analyzer turns the unresolved logical plan into a resolved one by looking up tables, columns and functions. Optimization, physical planning and code generation follow."},
{s:"sp_arch",q:"What does whole-stage code generation do?",
 o:["Fuses several physical operators into one generated Java function to avoid virtual calls and intermediate rows","Generates Python code for UDFs so they can run inside the executors' JVM","Compiles the SQL text into an RDD lineage that is cached for the next query","Writes the generated query plan to the event log so the Spark UI can display it"],
 e:"Tungsten's whole-stage codegen collapses chains of operators (scan, filter, project, partial aggregate) into a single tight loop, which shows up as WholeStageCodegen in the plan."},
{s:"sp_arch",q:"Which call prints the physical plan of a DataFrame in a readable, sectioned format?",
 o:["df.explain(mode=\"formatted\")","df.printSchema()","df.describe()","df.show(vertical=True)"],
 e:"explain() shows the plan; mode='formatted' (or 'extended', 'cost', 'codegen') controls the detail. printSchema only shows columns and types."},
{s:"sp_arch",q:"Why does lazy evaluation help performance?",
 o:["The optimizer sees the whole query and can push filters down, prune columns and reorder work before running anything","Every intermediate DataFrame is kept in memory, so later steps never recompute anything","Each transformation is tried on the driver first, so errors are caught before executors start","Executors are only started at the end, which saves cluster cost while the code is being written"],
 e:"Because nothing runs until an action, Catalyst can optimize across all steps, for example reading only needed columns and pushing predicates into the data source."},
{s:"sp_arch",q:"With spark.task.cpus left at 1, what does spark.executor.cores control?",
 o:["How many tasks one executor can run at the same time","How many executors the application gets","The number of shuffle partitions","How many threads the driver uses for planning"],
 e:"Each core is a task slot. An executor with 4 cores runs up to 4 tasks concurrently."},
{s:"sp_arch",q:"What does enabling spark.speculation do?",
 o:["Launches a backup copy of unusually slow tasks and uses whichever finishes first","Predicts the result of a query before it runs","Caches DataFrames that are likely to be reused","Retries failed jobs on a new cluster"],
 e:"Speculative execution targets stragglers caused by slow nodes. It does not help with data skew, because the copy gets the same oversized partition."},
{s:"sp_arch",q:"A task fails because of a transient error on an executor. What does Spark do by default?",
 o:["Retries the task, up to spark.task.maxFailures attempts (4 by default) before failing the job","Fails the job immediately, because tasks are assumed to be deterministic and would fail again","Skips the failed partition and continues, recording the missing rows in the event log","Restarts the driver, which then resubmits the whole job from the first stage"],
 e:"Tasks are retried on the same or other executors. Only when one task fails maxFailures times does the stage, and then the job, fail."},
{s:"sp_arch",q:"How do jobs, stages and tasks relate?",
 o:["An action creates one or more jobs, each job is split into stages at shuffle boundaries, and each stage runs one task per partition","A stage contains several jobs, and each job runs one task per executor","Each task runs a whole job on one executor, and stages group tasks by executor","Jobs and stages are the same thing since Spark 3; tasks are created one per core"],
 e:"This hierarchy is what you see in the Spark UI: Jobs tab, then stages within a job, then tasks within a stage."},
{s:"sp_arch",q:"What is a broadcast variable?",
 o:["A read-only value shipped once to each executor and cached there, instead of with every task","A variable that all tasks can update","A column added to every row of a DataFrame","A configuration that is sent to the cluster manager"],
 e:"Broadcasting a lookup table or model avoids serializing it with each task closure. Broadcast joins use the same mechanism for small tables."},
{s:"sp_arch",q:"Why can an accumulator updated inside a transformation report a higher count than expected?",
 o:["Tasks can be re-executed (retries, speculation, recomputation), and updates inside transformations are applied every time","Accumulators are approximate by design and can overcount by a small random amount","Each executor keeps its own copy, and the driver adds all copies plus its own initial value","The driver adds one to every accumulator for each stage the job runs"],
 e:"Spark guarantees each task's update is applied once only for accumulators updated inside actions such as foreach. In transformations, recomputed tasks add again."},
{s:"sp_arch",q:"What does dynamic allocation do?",
 o:["Adds and removes executors based on the backlog of pending tasks","Moves partitions between executors during a stage","Resizes the driver's memory at runtime","Chooses the join strategy at runtime"],
 e:"With spark.dynamicAllocation.enabled the application requests executors when tasks queue up and releases idle ones. Shuffle data must stay available, through the external shuffle service or shuffle tracking."},
{s:"sp_arch",q:"How does Spark recover a lost partition of an uncached DataFrame after an executor dies?",
 o:["It recomputes the partition from its lineage, the chain of transformations from the source","It restores it from a replica on another executor","It asks the user to rerun the job","It reads it back from the driver's memory"],
 e:"Lineage-based recovery is the core fault-tolerance idea: deterministic transformations can always be replayed from the original data."},
{s:"sp_arch",q:"What changes for client code when it uses Spark Connect?",
 o:["The client sends unresolved logical plans to a remote Spark server over gRPC and has no direct SparkContext or RDD access","The client runs the executors inside its own process, so no cluster is needed","Queries are executed eagerly on each call instead of lazily when an action runs","Only SQL strings can be sent to the server; the DataFrame API is not supported"],
 e:"Spark Connect separates a thin client from the server. The DataFrame API works as usual, but JVM objects such as SparkContext and the RDD API are not available on the client."},
{s:"sp_arch",q:"What is the recommended entry point for DataFrame and SQL work since Spark 2.0?",
 o:["SparkSession","SQLContext","HiveContext","StreamingContext"],
 e:"SparkSession unifies the older contexts. The underlying SparkContext is still reachable as spark.sparkContext in classic (non-Connect) mode."},
{s:"sp_arch",q:"Where are shuffle files written during a shuffle?",
 o:["To the local disks of the executors that produced the map output","To the driver's memory","Directly to the target table","To the cluster manager's database"],
 e:"Map tasks write shuffle blocks to local disk; reduce tasks fetch them over the network. An external shuffle service can keep serving them after an executor is removed."},
{s:"sp_arch",q:"A reduce task hits a FetchFailedException. What does Spark do?",
 o:["Marks the map output as lost and re-runs the parent stage that produced it, then retries the failing stage","Retries only the failing reduce task until the shuffle block appears again","Ignores the missing shuffle block and returns results from the blocks it could read","Fails the application immediately, because lost shuffle data cannot be rebuilt"],
 e:"Missing shuffle output means the producing stage must run again (at least the lost map tasks) before the consuming stage can continue."},
{s:"sp_arch",q:"In Spark's unified memory model, what shares the region sized by spark.memory.fraction?",
 o:["Execution memory (shuffles, joins, sorts, aggregations) and storage memory (cached data), which can borrow from each other","Only cached data; execution memory for shuffles and joins is a separate fixed region","Python worker memory and the JVM heap, which are balanced against each other","Driver and executor memory, so a large collect can borrow memory from executors"],
 e:"Execution can evict cached blocks down to the protected storage fraction, and storage can use idle execution memory. The rest of the heap holds user objects and Spark internals."},
{s:"sp_arch",q:"Why is calling collect() on a large DataFrame risky?",
 o:["It copies every row to the driver, which can run out of memory","It deletes the DataFrame after reading","It forces every executor to cache the data","It disables query optimization"],
 e:"collect() returns all rows as local objects in the driver. Use take, limit, show or write the result out instead."},

/* ---- Apache Spark: DataFrame API ---- */
{s:"sp_df",q:"What does df.withColumn(\"total\", col(\"price\") * col(\"qty\")) do to df?",
 o:["Nothing; it returns a new DataFrame with the extra column, because DataFrames are immutable","Adds the total column to df in place, so df now has the extra column","Writes the new column back to the source files the next time an action runs","Fails unless df was cached first, because existing rows cannot be extended"],
 e:"Every transformation returns a new DataFrame. Assign the result: df2 = df.withColumn(...)."},
{s:"sp_df",q:"Code adds 300 columns by calling withColumn in a loop and becomes very slow before any data is read. What is the better approach?",
 o:["Build all the column expressions and add them in one select (or one withColumns call)","Cache the DataFrame after every withColumn so each step starts from materialized data","Increase spark.sql.shuffle.partitions so the 300 projections run in parallel","Call repartition between withColumn calls so each column is computed on fresh partitions"],
 e:"Each withColumn adds a projection to the plan, so hundreds of calls create a huge plan that is slow to analyze. A single select or withColumns({...}) avoids that."},
{s:"sp_df",q:"Which method adds or replaces several columns at once from a dictionary of name to expression?",
 o:["withColumns","withColumnsRenamed","selectExpr","toDF"],
 e:"withColumns (Spark 3.3+) takes a dict such as {\"a\": expr1, \"b\": expr2}. withColumnsRenamed renames; toDF replaces all column names."},
{s:"sp_df",q:"What is the difference between df.filter(cond) and df.where(cond)?",
 o:["None; where is an alias for filter","where works only with SQL strings","filter runs on the driver","where keeps rows that do not match"],
 e:"Both accept a Column or a SQL expression string and produce the same plan."},
{s:"sp_df",q:"What does df.dropDuplicates([\"customer_id\"]) return?",
 o:["One row per customer_id; which row is kept is not guaranteed","Only customer_ids that appear exactly once","All columns deduplicated across every column","The duplicate rows that were removed"],
 e:"dropDuplicates with a subset keeps one arbitrary row per key. To keep the latest row, use a window with row_number ordered by a timestamp."},
{s:"sp_df",q:"How does distinct() differ from dropDuplicates() with no arguments?",
 o:["They are equivalent: both remove rows that are identical in every column","distinct only looks at the first column, while dropDuplicates compares all columns","dropDuplicates with no arguments keeps every row, because it needs a column list","distinct also sorts the output, while dropDuplicates keeps the original order"],
 e:"distinct() equals dropDuplicates() over all columns. Only dropDuplicates accepts a subset of columns."},
{s:"sp_df",q:"How do you keep rows where the column email is missing?",
 o:["df.filter(col(\"email\").isNull())","df.filter(col(\"email\") == None)","df.filter(col(\"email\") == \"null\")","df.filter(not col(\"email\"))"],
 e:"Comparing with None produces NULL, which filter treats as false. Use isNull() or isNotNull()."},
{s:"sp_df",q:"How does union combine two DataFrames?",
 o:["By column position, keeping duplicates","By column name, removing duplicates","By column name, keeping duplicates","By position, removing duplicates"],
 e:"union (and unionAll) match columns by position like SQL UNION ALL. Use unionByName to match names, and distinct() to remove duplicates."},
{s:"sp_df",q:"Two DataFrames have mostly the same columns, but one has an extra column. Which call stacks them and fills the missing column with nulls?",
 o:["a.unionByName(b, allowMissingColumns=True)","a.union(b)","a.join(b, how=\"outer\")","a.crossJoin(b)"],
 e:"allowMissingColumns (Spark 3.1+) adds missing columns as null on the side that lacks them."},
{s:"sp_df",q:"Which expression labels orders over 1000 as 'large' and all others as 'small'?",
 o:["when(col(\"amount\") > 1000, \"large\").otherwise(\"small\")","if(col(\"amount\") > 1000, \"large\", \"small\")","col(\"amount\").case(1000, \"large\", \"small\")","iff(col(\"amount\") > 1000).then(\"large\")"],
 e:"when/otherwise is the DataFrame form of CASE WHEN. Without otherwise, unmatched rows get NULL."},
{s:"sp_df",q:"With spark.sql.ansi.enabled set to false, what does casting the string 'abc' to int return?",
 o:["NULL","0","An error that stops the query","The string 'abc' unchanged"],
 e:"Without ANSI mode an invalid cast yields NULL. With ANSI mode on (the default from Spark 4.0) it raises an error; try_cast returns NULL in both modes."},
{s:"sp_df",q:"A row has an empty array in column tags. What happens to that row with explode(\"tags\") versus explode_outer(\"tags\")?",
 o:["explode drops it; explode_outer keeps it with a NULL tag","Both drop it","Both keep it with a NULL tag","explode keeps it; explode_outer drops it"],
 e:"explode produces one row per element, so empty or null arrays produce none. explode_outer emits one row with NULL instead."},
{s:"sp_df",q:"Which code computes the total amount per region with a column named total?",
 o:["df.groupBy(\"region\").agg(F.sum(\"amount\").alias(\"total\"))","df.groupBy(\"region\").sum(\"amount\").name(\"total\")","df.agg(\"region\", F.sum(\"amount\"))","df.groupBy(F.sum(\"amount\")).alias(\"region\")"],
 e:"agg takes aggregate expressions, and alias names the output column. The shortcut sum(\"amount\") would name it sum(amount)."},
{s:"sp_df",q:"What is the difference between orderBy and sortWithinPartitions?",
 o:["orderBy produces a total order across partitions (with a shuffle); sortWithinPartitions sorts each partition independently without a shuffle","They are identical; sortWithinPartitions is the older name kept for compatibility","sortWithinPartitions gives a global order but is slower because it sorts twice","orderBy only works on a single column, while sortWithinPartitions accepts several"],
 e:"orderBy (alias sort) range-partitions the data to get a global order. sortWithinPartitions is cheaper when only per-partition order matters, for example before writing."},
{s:"sp_df",q:"What does df.take(5) return?",
 o:["A list of 5 Row objects on the driver","A new DataFrame with 5 rows","A pandas DataFrame","Nothing; it only prints"],
 e:"take is an action that returns rows to the driver. limit(5) is a transformation that returns a DataFrame."},
{s:"sp_df",q:"Long text values are cut off with '...' in df.show(). How do you print them in full?",
 o:["df.show(truncate=False)","df.show(full=True)","df.printSchema()","df.display(width=0)"],
 e:"show truncates strings to 20 characters by default. truncate=False (or a number) changes that."},
{s:"sp_df",q:"Why define an explicit schema with StructType when reading JSON or CSV?",
 o:["It avoids an extra pass over the data to infer types and guarantees the expected types","It makes the data smaller on disk, because typed values compress better than strings","It is required for Parquet files, which cannot be read without a StructType","It turns on column statistics so later filters can skip files"],
 e:"Inference reads data (or a sample) before the real job and can guess wrong types. A schema makes reads faster and predictable."},
{s:"sp_df",q:"Which function adds a constant value as a column?",
 o:["F.lit(\"EU\")","F.col(\"EU\")","F.const(\"EU\")","F.value(\"EU\")"],
 e:"lit wraps a literal as a Column. col refers to an existing column by name."},
{s:"sp_df",q:"After joining two DataFrames that both have a column named id with a.join(b, a.id == b.id), selecting \"id\" fails. Why?",
 o:["Both id columns are kept, so the name is ambiguous; refer to a.id or b.id, or join on \"id\" by name","The join dropped the id column from both sides, because it was used as the key","id is a reserved word in Spark SQL and must be quoted with backticks","Joins rename duplicate columns to id_1 and id_2, so the original name no longer exists"],
 e:"A column-expression join keeps both sides' columns. Joining with on=\"id\" (or [\"id\"]) keeps a single id column."},
{s:"sp_df",q:"How do you rename the column cust to customer_id?",
 o:["df.withColumnRenamed(\"cust\", \"customer_id\")","df.rename(\"cust\", \"customer_id\")","df.withColumn(\"cust\", \"customer_id\")","df.alias(\"customer_id\")"],
 e:"withColumnRenamed returns a new DataFrame; it is a no-op if the column does not exist."},
{s:"sp_df",q:"Why pass the list of values to pivot, as in groupBy(\"store\").pivot(\"month\", [\"Jan\",\"Feb\",\"Mar\"])?",
 o:["Spark skips an extra job that would otherwise compute the distinct values of the pivot column","It sorts the output columns alphabetically, which pivot does not do otherwise","It is required for numeric pivot columns, which cannot be discovered automatically","It makes pivot a narrow transformation, so the groupBy no longer needs a shuffle"],
 e:"Without the values, pivot runs a distinct query first to discover the output columns."},
{s:"sp_df",q:"What does df.sample(fraction=0.1) guarantee?",
 o:["Each row is kept with probability 0.1, so the result is about 10% of rows, not exactly","Exactly 10% of the rows, chosen at random across all partitions","The first 10% of rows in each partition, which is fast but not random","A sample with 10% of the rows of every key, like a stratified sample"],
 e:"Sampling is per row and random. Use limit for an exact count, or sampleBy for stratified samples."},
{s:"sp_df",q:"You call df.cache() and then nothing else. Is the data cached?",
 o:["Not yet; caching happens lazily the first time an action computes the DataFrame","Yes, the data is read and stored on all executors as soon as cache() returns","Only on the driver; executors cache their partitions at the next shuffle","Only the schema and plan are cached; the data itself is never kept"],
 e:"cache() marks the plan for caching. The first action fills the cache; later actions reuse it."},
{s:"sp_df",q:"What is the default storage level of DataFrame.cache()?",
 o:["MEMORY_AND_DISK","MEMORY_ONLY","DISK_ONLY","OFF_HEAP"],
 e:"For DataFrames cache() persists at a MEMORY_AND_DISK level; partitions that do not fit in memory go to disk instead of being recomputed."},

/* ---- Apache Spark: SQL and functions ---- */
{s:"sp_sql",q:"How long does a view created with df.createOrReplaceTempView(\"sales\") live?",
 o:["For the SparkSession that created it","Until the cluster restarts, across all sessions","Permanently in the metastore","Only for the next query"],
 e:"Temp views are session-scoped and are not stored in the catalog. Use a table or a global temp view for wider scope."},
{s:"sp_sql",q:"How do you query a global temporary view named rates?",
 o:["SELECT * FROM global_temp.rates","SELECT * FROM rates","SELECT * FROM temp.rates","SELECT * FROM default.rates"],
 e:"Global temp views live in the system database global_temp and are shared by sessions of the same Spark application."},
{s:"sp_sql",q:"Which expression numbers orders 1, 2, 3 ... within each customer, newest first?",
 o:["row_number().over(Window.partitionBy(\"customer_id\").orderBy(col(\"order_ts\").desc()))","rank().over(Window.orderBy(\"customer_id\"))","monotonically_increasing_id()","count(\"*\").over(Window.partitionBy(\"customer_id\"))"],
 e:"row_number gives a unique sequence per partition of the window. Filtering row_number == 1 is the standard 'latest row per key' pattern."},
{s:"sp_sql",q:"Scores 100, 100 and 90 are ranked in descending order. What do rank() and dense_rank() return?",
 o:["rank: 1, 1, 3; dense_rank: 1, 1, 2","rank: 1, 2, 3; dense_rank: 1, 1, 2","rank: 1, 1, 2; dense_rank: 1, 1, 3","Both: 1, 2, 3"],
 e:"rank leaves gaps after ties; dense_rank does not. row_number would give 1, 2, 3."},
{s:"sp_sql",q:"Which window function returns the previous row's value within the window's order?",
 o:["lag","lead","first","nth_value with offset 2"],
 e:"lag(col, n) looks n rows back; lead looks forward. Both return NULL (or a default) when there is no such row."},
{s:"sp_sql",q:"Which window spec gives a running total that adds exactly one row at a time, even when order values tie?",
 o:["Window.orderBy(\"ts\").rowsBetween(Window.unboundedPreceding, Window.currentRow)","Window.orderBy(\"ts\")","Window.partitionBy(\"ts\")","Window.orderBy(\"ts\").rangeBetween(-1, 1)"],
 e:"With only orderBy, the default frame is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, which includes all rows tied with the current one. rowsBetween counts physical rows."},
{s:"sp_sql",q:"What is the difference between collect_list and collect_set?",
 o:["collect_list keeps duplicates; collect_set removes them","collect_set keeps insertion order","collect_list only works on strings","They are aliases"],
 e:"Both gather values into an array per group and skip NULLs. Neither guarantees an order without sorting."},
{s:"sp_sql",q:"Which call parses the string '17/03/2025' into a date?",
 o:["to_date(col(\"d\"), \"dd/MM/yyyy\")","to_date(col(\"d\"), \"MM/dd/yyyy\")","date_format(col(\"d\"), \"dd/MM/yyyy\")","cast(col(\"d\") as date)"],
 e:"to_date parses with a pattern. date_format goes the other way, from date to string. A plain cast expects yyyy-MM-dd."},
{s:"sp_sql",q:"What does coalesce(col(\"phone\"), col(\"mobile\"), lit(\"unknown\")) return?",
 o:["The first non-null value among phone, mobile and 'unknown'","The number of partitions","A concatenation of the three values","NULL if any input is NULL"],
 e:"The SQL function coalesce picks the first non-null argument. It is unrelated to DataFrame.coalesce, which reduces partitions."},
{s:"sp_sql",q:"Which function pulls the digits out of 'order-12345-EU'?",
 o:["regexp_extract(col(\"s\"), r\"(\\d+)\", 1)","regexp_replace(col(\"s\"), r\"\\d+\", \"\")","substring_index(col(\"s\"), \"-\", 1)","split(col(\"s\"), \"-\")[0]"],
 e:"regexp_extract returns the given capture group. Index 1 is the first group, here the run of digits."},
{s:"sp_sql",q:"What type does split(col(\"tags\"), \",\") return?",
 o:["An array of strings","A string with commas removed","A map","One row per element"],
 e:"split returns ARRAY<STRING>. Combine with explode to get one row per element."},
{s:"sp_sql",q:"How do you parse a JSON string column into a struct you can query with dot notation?",
 o:["from_json(col(\"payload\"), schema)","to_json(col(\"payload\"))","get_json_object(col(\"payload\"))","cast(col(\"payload\") as struct)"],
 e:"from_json needs a schema (StructType or DDL string). get_json_object extracts one value by JSON path as a string."},
{s:"sp_sql",q:"Which function returns a single field from a JSON string by path, without a schema?",
 o:["get_json_object(col(\"payload\"), \"$.user.id\")","from_json(col(\"payload\"), \"$.user.id\")","json_tuple(col(\"payload\"))","schema_of_json(col(\"payload\"))"],
 e:"get_json_object returns the value as a string, or NULL if the path is missing."},
{s:"sp_sql",q:"A column values has 1, NULL and 3. What do COUNT(values) and COUNT(*) return?",
 o:["2 and 3","3 and 3","2 and 2","3 and 2"],
 e:"COUNT(col) skips NULLs; COUNT(*) counts rows."},
{s:"sp_sql",q:"What is AVG over the values 10, NULL and 20?",
 o:["15.0","10.0","NULL","An error"],
 e:"Aggregate functions ignore NULLs, so the average is over 10 and 20."},
{s:"sp_sql",q:"What does NULL = NULL evaluate to in Spark SQL, and how do you compare nulls as equal?",
 o:["NULL; use the null-safe operator <=> (eqNullSafe)","true; no special operator is needed","false; use IS instead","An error; nulls cannot be compared"],
 e:"Any comparison with NULL yields NULL. <=> returns true when both sides are NULL."},
{s:"sp_sql",q:"Which expression adds 1 to every element of an array column without exploding it?",
 o:["transform(col(\"nums\"), lambda x: x + 1)","explode(col(\"nums\")) + 1","array(col(\"nums\") + 1)","aggregate(col(\"nums\"), 1)"],
 e:"Higher-order functions (transform, filter, exists, aggregate) work on arrays in place, which is much cheaper than explode and regroup."},
{s:"sp_sql",q:"What does EXCEPT return in Spark SQL?",
 o:["Distinct rows of the first query that do not appear in the second","All rows of both queries","Rows common to both queries","Rows of the second query missing from the first, with duplicates"],
 e:"EXCEPT (EXCEPT DISTINCT) removes duplicates. EXCEPT ALL (exceptAll in the DataFrame API) keeps them."},
{s:"sp_sql",q:"What does spark.sql(\"SELECT ...\") return?",
 o:["A DataFrame","A list of rows","A pandas DataFrame","Nothing until show() is called"],
 e:"SQL and the DataFrame API compile to the same plans. The result is a lazy DataFrame you can keep transforming."},
{s:"sp_sql",q:"Which function counts distinct users quickly on billions of rows when a small error is acceptable?",
 o:["approx_count_distinct","countDistinct","count","collect_set then size"],
 e:"approx_count_distinct uses HyperLogLog++ with a configurable relative error, avoiding a full shuffle of distinct values."},
{s:"sp_sql",q:"Which function returns an approximate median of a numeric column?",
 o:["percentile_approx(col(\"latency\"), 0.5)","median_exact(col(\"latency\"))","avg(col(\"latency\"))","ntile(2)"],
 e:"percentile_approx (alias approx_percentile) trades exactness for speed. Spark 3.4+ also has median and percentile for exact values."},
{s:"sp_sql",q:"By default, is Spark SQL case sensitive for column names?",
 o:["No; spark.sql.caseSensitive is false, so SELECT ID finds a column named id","Yes, always; ID and id are two different columns in every data source","Only for Parquet files, because Parquet stores column names case-sensitively","Only inside temporary views; tables in the catalog are case insensitive"],
 e:"Column resolution is case insensitive unless spark.sql.caseSensitive is set to true."},
{s:"sp_sql",q:"Which function turns rows of key and value into one map per group?",
 o:["map_from_entries(collect_list(struct(\"k\", \"v\")))","explode(map(\"k\", \"v\"))","to_json(struct(\"k\", \"v\"))","pivot(\"k\")"],
 e:"Collect structs of (key, value) into an array, then map_from_entries builds the map."},
/* ---- Apache Spark: joins, shuffles and partitioning ---- */
{s:"sp_join",q:"When does Spark pick a broadcast hash join automatically?",
 o:["When its size estimate for one side is below spark.sql.autoBroadcastJoinThreshold (10 MB by default)","Whenever both tables are stored as Parquet, because their sizes are known exactly","When the join key is a string, since string keys hash faster on one side","Only when a broadcast hint is given; Spark never broadcasts on its own"],
 e:"The small side is copied to every executor, so the large side does not need to be shuffled. AQE can also switch to a broadcast join at runtime using actual sizes."},
{s:"sp_join",q:"How do you force a broadcast of a small DataFrame dims in a join?",
 o:["facts.join(broadcast(dims), \"key\")","facts.join(dims.cache(), \"key\")","facts.join(dims, \"key\", \"broadcast\")","dims.repartition(1).join(facts)"],
 e:"pyspark.sql.functions.broadcast (or the SQL hint /*+ BROADCAST(d) */) marks the side to broadcast."},
{s:"sp_join",q:"Which join strategy does Spark use by default for an equi-join of two large tables?",
 o:["Sort-merge join","Broadcast nested loop join","Cartesian product","Broadcast hash join"],
 e:"Both sides are shuffled by key and sorted, then merged. It scales to any size but costs two shuffles and sorts."},
{s:"sp_join",q:"Which join type returns customers who have no orders, with only the customer columns?",
 o:["left_anti","left_outer","left_semi","full_outer"],
 e:"left_anti keeps left rows without a match. left_semi keeps left rows with a match. Neither returns right-side columns."},
{s:"sp_join",q:"What does a left_semi join return?",
 o:["Left rows that have at least one match on the right, without duplicating them and without right columns","All left rows with the matching right columns added, NULL where there is no match","The right rows that have a match on the left, with only right-side columns","Rows that exist on only one side, similar to a symmetric difference"],
 e:"A semi join behaves like WHERE EXISTS: a left row appears once even if it matches many right rows."},
{s:"sp_join",q:"Two DataFrames of 1,000 and 2,000 rows are combined with crossJoin. How many rows result?",
 o:["2,000,000","3,000","1,000","2,000"],
 e:"A cross join pairs every left row with every right row. It is rarely what you want on large data."},
{s:"sp_join",q:"Both tables have rows whose join key is NULL. Do those rows match in an inner equi-join?",
 o:["No; NULL = NULL is not true, so they are dropped (use eqNullSafe to match them)","Yes, NULL keys always match each other in an equi-join","Only in left joins, where NULL keys from the left side match NULLs on the right","Only when both sides are cached, because cached data keeps NULLs comparable"],
 e:"Equality with NULL yields NULL. a.k.eqNullSafe(b.k) or <=> treats two NULLs as equal."},
{s:"sp_join",q:"What is the output column layout of a.join(b, \"id\")?",
 o:["One id column followed by the other columns of a and b","Two id columns, a.id and b.id","Only the columns of a","Columns renamed to id_left and id_right"],
 e:"Joining by column name (or a list of names) merges the key columns. Joining with an expression keeps both."},
{s:"sp_join",q:"What is the default value of spark.sql.shuffle.partitions?",
 o:["200","Number of cores in the cluster","8","1000"],
 e:"It sets the partition count after shuffles in SQL and DataFrame operations. AQE can coalesce these partitions at runtime."},
{s:"sp_join",q:"You need to reduce 400 partitions to 50 before a write, without a full shuffle. Which call fits?",
 o:["coalesce(50)","repartition(50)","repartition(50, \"id\")","sortWithinPartitions(50)"],
 e:"coalesce merges existing partitions locally. repartition always shuffles, which balances sizes but costs more."},
{s:"sp_join",q:"What does df.repartition(\"customer_id\") do?",
 o:["Shuffles rows so that all rows with the same customer_id land in the same partition (hash partitioning)","Sorts the whole DataFrame by customer_id without changing the partitions","Creates one output folder per customer_id the next time the data is written","Removes duplicate customer_ids, keeping one row per customer in each partition"],
 e:"The partition count is spark.sql.shuffle.partitions unless you pass one. Use partitionBy on the writer for folders."},
{s:"sp_join",q:"What does df.write.partitionBy(\"country\").parquet(path) produce?",
 o:["A subdirectory per country value, such as country=IN, with the country column encoded in the path","One file per country inside a single folder, named after the country value","A single Parquet file sorted by country, with row-group statistics per country","Numbered hash buckets 0 to N, where each bucket holds several countries"],
 e:"Readers can prune whole directories when filtering on country. Avoid high-cardinality partition columns, which create many small files."},
{s:"sp_join",q:"What is the benefit of bucketing two tables by the same key into the same number of buckets?",
 o:["Joins and aggregations on that key can avoid a shuffle","Files become smaller","It enables time travel","It removes the need for a schema"],
 e:"bucketBy with saveAsTable stores data pre-hashed by key. Matching bucket layouts let Spark skip the exchange."},
{s:"sp_join",q:"In a join, 199 tasks finish in seconds and one task runs for 40 minutes. What is the most likely cause?",
 o:["Data skew: one join key has far more rows than the others","Too few executors","The broadcast threshold is too high","Speculative execution is disabled"],
 e:"All rows of a key go to one task. Fixes include AQE skew join handling, salting the hot key, or broadcasting the other side."},
{s:"sp_join",q:"How does salting help with a skewed join key?",
 o:["It adds a random suffix to the hot key on the large side and replicates the matching rows on the small side, spreading the work over many tasks","It encrypts the join key so that equal keys hash to different executors","It sorts the hot key's rows before the join so that the merge step is faster","It drops a random share of the hot key's rows, which is acceptable for estimates"],
 e:"The skewed key becomes key_0 ... key_N, so its rows land in N partitions. The other side is exploded to all N variants so every match is still found."},
{s:"sp_join",q:"Which Adaptive Query Execution feature merges many tiny post-shuffle partitions into fewer, larger ones?",
 o:["Coalescing post-shuffle partitions","Dynamic partition pruning","Whole-stage codegen","Speculative execution"],
 e:"With spark.sql.adaptive.coalescePartitions.enabled, AQE uses real shuffle sizes to combine small partitions, so 200 partitions of a few KB become a handful."},
{s:"sp_join",q:"Which AQE optimization can change a planned sort-merge join into a broadcast hash join?",
 o:["Converting the join at runtime when the actual size of one side is below the broadcast threshold","Rewriting the query into SQL","Disabling the shuffle on both sides before it runs","Caching both tables"],
 e:"AQE re-plans at shuffle boundaries using measured statistics, so a side that turns out small after filtering can still be broadcast."},
{s:"sp_join",q:"Roughly how large are the partitions Spark creates when reading Parquet files, by default?",
 o:["Up to 128 MB each, set by spark.sql.files.maxPartitionBytes","Exactly one partition per file","200 partitions, from spark.sql.shuffle.partitions","1 GB each"],
 e:"File splits are packed into partitions up to maxPartitionBytes (also accounting for openCostInBytes), so large files split and small files are combined."},
{s:"sp_join",q:"In a physical plan, what does an Exchange operator mean?",
 o:["A shuffle (or broadcast) that moves data between executors","A cache lookup","A filter pushed to the source","A Python UDF call"],
 e:"Exchange hashpartitioning(...) is a shuffle; BroadcastExchange sends a table to all executors. Counting exchanges is a quick way to spot expensive steps."},
{s:"sp_join",q:"A join condition is a range, such as a.ts BETWEEN b.start AND b.end, with no equality. What does Spark generally have to use?",
 o:["A broadcast nested loop join or a cartesian product, which compare many row pairs","A sort-merge join, sorting both sides by ts and merging the overlapping ranges","A shuffle hash join on ts, which builds a hash table of the range boundaries","A bucketed join, which Spark sets up automatically for range conditions"],
 e:"Hash and sort-merge joins need an equality key. Adding an equality (for example a bucketed time key) to range joins lets Spark use them."},
{s:"sp_join",q:"How do you check how many partitions a DataFrame has?",
 o:["df.rdd.getNumPartitions()","df.partitions()","df.count(partitions=True)","spark.conf.get(\"partitions\")"],
 e:"The DataFrame's underlying RDD reports its partition count."},
{s:"sp_join",q:"Why can df.coalesce(1).write... be slow on a large dataset?",
 o:["All data flows through a single task, so only one core does the work","coalesce always triggers two full shuffles, one before and one after the merge","Single output files cannot be compressed, so far more bytes are written","It disables predicate pushdown for the read at the start of the job"],
 e:"coalesce(1) also pulls the reduced parallelism up into earlier work in the same stage. If one file is truly needed, repartition(1) at least keeps upstream work parallel."},
{s:"sp_join",q:"When is a shuffle hash join chosen over a sort-merge join?",
 o:["When one side is small enough per partition to build a hash table, avoiding the sort (for example with a SHUFFLE_HASH hint or AQE)","When both sides are larger than memory, since hashing needs less memory than sorting","When the join has no equality keys and only range conditions","When the data is already sorted by the join key on both sides"],
 e:"Shuffle hash join skips sorting but needs each partition of the build side to fit in memory."},
{s:"sp_join",q:"Left table has 100 rows with distinct keys. The right table has every key exactly twice. How many rows does an inner join return?",
 o:["200","100","2","400"],
 e:"Each left row matches two right rows. Duplicate keys on either side multiply rows, a common source of inflated totals."},

/* ---- Apache Spark: performance tuning ---- */
{s:"sp_perf",q:"When is caching a DataFrame worth it?",
 o:["When the same expensive DataFrame is reused by several actions","Before every single action","When the DataFrame is read only once","To make writes faster"],
 e:"Caching costs memory and a first pass to fill. It pays off only when the cached result is reused, as in iterative or branching pipelines."},
{s:"sp_perf",q:"How do you release a cached DataFrame's memory?",
 o:["df.unpersist()","del df","df.uncache(True) on the driver only","spark.stop()"],
 e:"unpersist removes the cached blocks from executors. spark.catalog.clearCache() removes all cached tables and DataFrames."},
{s:"sp_perf",q:"What is predicate pushdown?",
 o:["Passing filters to the data source so it reads less data, such as skipping Parquet row groups by min/max statistics","Moving filters after joins so that the join sees all rows before anything is removed","Pushing Python UDFs to Python workers so they run closer to the data","Sending filter conditions to the driver, which evaluates them before tasks start"],
 e:"In explain output it appears as PushedFilters on the scan. Filters on UDF results cannot be pushed down."},
{s:"sp_perf",q:"Why does selecting only the needed columns speed up Parquet reads?",
 o:["Parquet is columnar, so Spark reads only the requested columns (column pruning)","Selecting columns triggers extra compression of the remaining columns","It avoids the shuffle that every Parquet read would otherwise perform","It turns on caching of the selected columns for later queries"],
 e:"Unused columns are never read from disk. With row formats such as CSV every byte is still parsed."},
{s:"sp_perf",q:"The Spark UI shows large 'Spill (Disk)' values for a stage. What usually helps?",
 o:["More, smaller partitions (or more executor memory) so each task's data fits in memory","Fewer partitions, so each task does more work and needs fewer disk writes","Turning off AQE, because adaptive coalescing is what causes the spill","Calling collect() earlier so the data is processed on the driver instead"],
 e:"Spill happens when execution memory is not enough for a task's shuffle, sort or aggregation. Splitting the work or adding memory reduces it."},
{s:"sp_perf",q:"A table is made of 200,000 files of 50 KB each. Why are reads slow?",
 o:["Listing and opening many tiny files costs more than reading the data (the small files problem)","Small files cannot be compressed, so far more data is read than necessary","Spark reads files one at a time on the driver when they are below 1 MB","Parquet does not support files under 128 MB, so they are read as text"],
 e:"Compact into files of hundreds of MB, for example by repartitioning before writes or using table maintenance such as OPTIMIZE in Delta Lake."},
{s:"sp_perf",q:"Which serializer is faster and more compact than Java serialization for RDDs of custom objects?",
 o:["Kryo, set with spark.serializer=org.apache.spark.serializer.KryoSerializer","Pickle, by setting spark.serializer to the Python pickle serializer","JSON, which is human readable and smaller for most objects","Avro, which Spark uses automatically for all RDDs of case classes"],
 e:"DataFrames use Tungsten's binary format internally, so this matters mostly for RDD code and cached RDDs."},
{s:"sp_perf",q:"Why should built-in functions be preferred over Python UDFs?",
 o:["Built-ins run in the JVM, are optimized by Catalyst and avoid moving rows to Python workers","Python UDFs cannot return strings or nested types, so built-ins are more flexible","Built-in functions run on the driver, which avoids network transfer","UDFs are not allowed in SQL queries, so built-ins are needed for SQL users"],
 e:"Python UDFs serialize rows to a Python process and back, and the optimizer cannot see inside them. Pandas UDFs reduce the cost with Arrow, but built-ins are still best."},
{s:"sp_perf",q:"Which is a common cause of executor out-of-memory errors?",
 o:["A few huge partitions from skew or too few shuffle partitions","Too many small partitions","Using select instead of withColumn","Reading Parquet instead of CSV"],
 e:"Memory is per task. One very large partition, for example from a hot key, can exceed what a single task gets."},
{s:"sp_perf",q:"Which is a common cause of driver out-of-memory errors?",
 o:["collect() or toPandas() on a large result, or broadcasting a table that is too big","Running too many executors, each of which reserves memory on the driver","A filter on a partition column, which loads the partition list into memory","Reading Parquet, because footers of all files are parsed on the driver"],
 e:"The driver must hold collected results and builds broadcast tables before sending them. Keep large data on executors."},
{s:"sp_perf",q:"What does dynamic partition pruning do?",
 o:["Uses the filtered rows of a dimension table at runtime to skip partitions of a joined fact table","Deletes old partitions of a table automatically once they fall outside a retention period","Changes the partition columns of a table on write based on the query patterns","Merges small partitions after a shuffle, based on their actual sizes"],
 e:"For a fact table partitioned by date joined to a filtered date dimension, Spark reads only the matching date partitions."},
{s:"sp_perf",q:"Which rule of thumb fits the number of partitions for a stage?",
 o:["Enough for every core to get work, often 2 to 4 tasks per core, with partitions of roughly 100-200 MB","Exactly one partition per executor, so each executor handles one large block","As many partitions as rows, so that every row is processed in parallel","Always 200, the default, since Spark tunes everything else around it"],
 e:"Too few partitions waste cores and risk spills; too many add scheduling overhead and tiny files."},
{s:"sp_perf",q:"Where in the Spark UI can you confirm that one task is much slower than the rest?",
 o:["The stage detail page, in the task summary metrics (max versus median duration)","The Environment tab, which lists the duration of each configuration step","The Executors tab, by opening each executor's log and searching for slow tasks","The SQL tab, by reading the query text and the estimated row counts"],
 e:"A max far above the 75th percentile, with matching input or shuffle-read sizes, points to skew."},
{s:"sp_perf",q:"An iterative algorithm builds a lineage of hundreds of steps and planning gets slower each loop. What helps?",
 o:["Checkpointing (or localCheckpoint) every few iterations to truncate the lineage","Increasing spark.sql.shuffle.partitions so each iteration has more parallelism","Using union instead of join inside the loop to keep the plan flat","Disabling AQE, because re-planning each iteration is what takes the time"],
 e:"checkpoint() materializes data and cuts the plan, so later iterations start from a short lineage."},
{s:"sp_perf",q:"Is Adaptive Query Execution on by default in Spark 3.2 and later?",
 o:["Yes, spark.sql.adaptive.enabled defaults to true","No, it must always be turned on manually","Only for streaming queries","Only on Kubernetes"],
 e:"AQE re-optimizes at shuffle boundaries using runtime statistics: coalescing partitions, switching join strategies and splitting skewed partitions."},
{s:"sp_perf",q:"Which setting lets AQE split oversized partitions in sort-merge joins?",
 o:["spark.sql.adaptive.skewJoin.enabled","spark.sql.autoBroadcastJoinThreshold","spark.speculation","spark.sql.files.maxPartitionBytes"],
 e:"AQE detects partitions far larger than the median and splits them, replicating the matching data from the other side."},
{s:"sp_perf",q:"Executors spend a large share of time in garbage collection. Which change usually helps most for DataFrame jobs?",
 o:["Reduce per-task memory pressure: more partitions, fewer cached objects, avoid UDFs that create many objects","Use more Python UDFs, which move work out of the JVM and reduce garbage","Increase spark.task.maxFailures so tasks that pause for GC are retried","Lower spark.sql.shuffle.partitions to 1 so fewer objects are created"],
 e:"High GC time means too many live objects per task. Built-in expressions use compact binary rows and create less garbage."},
{s:"sp_perf",q:"Why filter as early as possible in a pipeline, even though Catalyst often reorders filters?",
 o:["Less data flows into shuffles and joins; filters that the optimizer cannot move (for example after a UDF) only help if you place them early","Filters only work when they are the first transformation after a read","Early filters disable lazy evaluation, so the reduced data is materialized at once","Catalyst never reorders filters, so their position in the code is the execution order"],
 e:"Catalyst pushes deterministic filters down, but not past UDFs or some operators. Writing them early is a safe habit."},
{s:"sp_perf",q:"A notebook calls df.count() after every step to 'check progress'. What is the cost?",
 o:["Each count is an action that recomputes the plan up to that point, multiplying the work","None; count reads only Parquet metadata, so it costs nothing","Each count caches the DataFrame, which uses memory but speeds up later steps","Counts only read file statistics, so they never trigger a Spark job"],
 e:"Without caching, each action reruns everything upstream. Remove debug actions from production code."},
{s:"sp_perf",q:"How can you tell from the plan that a filter was pushed to a Parquet scan?",
 o:["The scan node lists it under PushedFilters","A Filter node appears above the Exchange","The plan shows BroadcastHashJoin","The DataFrame is marked cached"],
 e:"explain() shows FileScan parquet ... PushedFilters: [IsNotNull(x), EqualTo(x,1)]. Partition filters appear as PartitionFilters."},
{s:"sp_perf",q:"With StorageLevel.MEMORY_ONLY, what happens to cached partitions that do not fit in memory?",
 o:["They are not stored and are recomputed from lineage when needed","They are written to local disk instead, like MEMORY_AND_DISK","The job fails with an out-of-memory error when the cache is full","They are sent to the driver and stored there until memory frees up"],
 e:"MEMORY_AND_DISK would spill them to disk instead. Choose based on whether recomputing is cheaper than reading from disk."},
{s:"sp_perf",q:"How do you stop Spark from ever choosing a broadcast join automatically?",
 o:["Set spark.sql.autoBroadcastJoinThreshold to -1","Set spark.sql.shuffle.partitions to 0","Cache both tables","Disable whole-stage codegen"],
 e:"-1 disables size-based broadcasting. Explicit broadcast hints still apply."},
{s:"sp_perf",q:"Why is reading a CSV with inferSchema=true slower than with an explicit schema?",
 o:["Spark scans the data an extra time to guess column types","CSV with a schema is compressed","Inference disables partitioning","It reads the file on the driver"],
 e:"Inference costs a full pass (or a sampled one with samplingRatio). Supplying a schema skips it."},

/* ---- Apache Spark: Structured Streaming ---- */
{s:"sp_ss",q:"What is the programming model of Structured Streaming?",
 o:["A stream is treated as an unbounded table, and the query runs incrementally on new rows","Each event is processed by a separate job","Streams are converted to RDDs of micro-batches you manage yourself","Data is buffered until the stream ends, then processed in batch"],
 e:"You write the same DataFrame query as for batch; Spark keeps it up to date as data arrives."},
{s:"sp_ss",q:"Which output mode writes only rows added to the result table since the last trigger?",
 o:["append","complete","update","overwrite"],
 e:"complete rewrites the whole result; update writes changed rows. append rows must never change later, which matters for aggregations."},
{s:"sp_ss",q:"A streaming groupBy count with no watermark is started with outputMode(\"append\"). What happens?",
 o:["It fails analysis, because counts can change and append needs final rows; add a watermark on an event-time window or use update/complete","It works and emits every count once, when the user is first seen","It silently switches to complete mode and rewrites all counts each trigger","It runs but drops every row, because append mode cannot hold state"],
 e:"Append output for aggregations is allowed only with event-time windows and a watermark, so Spark knows when a group is final."},
{s:"sp_ss",q:"What does withWatermark(\"event_time\", \"10 minutes\") tell Spark?",
 o:["Data more than 10 minutes older than the latest event time seen may be treated as late, and state for older windows can be dropped","Process only events from the last 10 minutes and ignore everything older on startup","Trigger a new micro-batch every 10 minutes instead of as fast as possible","Delay every output row by exactly 10 minutes to wait for late data"],
 e:"The watermark bounds state size and lets append mode finalize windows. Late data beyond it is ignored by stateful operators."},
{s:"sp_ss",q:"What does the checkpoint location of a streaming query store?",
 o:["Source offsets, committed batches and operator state, so the query can resume exactly where it stopped","The output data of each micro-batch, so sinks can read it back after a failure","The Spark UI history of the query, so progress can be inspected later","The cluster configuration, so the query restarts with the same resources"],
 e:"Always set a reliable checkpoint per query. Two queries must never share one."},
{s:"sp_ss",q:"You change a streaming query's aggregation keys and restart it with the old checkpoint. What should you expect?",
 o:["The restart can fail or misbehave because the stored state no longer matches; incompatible changes need a new checkpoint","Spark migrates the stored state to the new keys automatically on restart","The old checkpoint is ignored and the query starts fresh from the latest offsets","The query reprocesses all data from the beginning using the old keys"],
 e:"Some changes (filters, projections) are allowed; changes to stateful operators generally are not."},
{s:"sp_ss",q:"Which trigger processes all data available now, in possibly several micro-batches, then stops?",
 o:["trigger(availableNow=True)","trigger(processingTime=\"0 seconds\")","trigger(continuous=\"1 second\")","No trigger set"],
 e:"availableNow suits scheduled incremental jobs. It replaces once=True, which forced everything into a single batch."},
{s:"sp_ss",q:"What happens when no trigger is specified on a streaming query?",
 o:["A new micro-batch starts as soon as the previous one finishes","It runs once and stops","It waits 1 minute between batches","It uses continuous processing"],
 e:"The default is micro-batches as fast as possible. Use processingTime to space them out."},
{s:"sp_ss",q:"Which sink pattern lets you run MERGE or write each micro-batch to several destinations?",
 o:["foreachBatch","foreach with a SQL string","writeStream.format(\"merge\")","outputMode(\"merge\")"],
 e:"foreachBatch gives you each micro-batch as a normal DataFrame plus its batch id, so any batch API can be used."},
{s:"sp_ss",q:"What makes end-to-end exactly-once results possible in Structured Streaming?",
 o:["A replayable source, checkpointed offsets and state, and an idempotent or transactional sink","Running the query with a single executor so no record is processed twice","Using complete output mode, which rewrites the whole result every trigger","Caching the input stream so a failed batch can be read from memory"],
 e:"After a failure Spark replays the same offsets; the sink must not double-write, for example by being transactional or using the batch id."},
{s:"sp_ss",q:"Where does a new Kafka streaming query start reading if startingOffsets is not set?",
 o:["latest, so only new messages are read","earliest, so all retained messages are read","From offset 0 on every partition","From the last committed consumer-group offset"],
 e:"The default for streaming is latest. Once a checkpoint exists, the query resumes from the checkpoint instead."},
{s:"sp_ss",q:"Can a streaming DataFrame be inner-joined with a static DataFrame?",
 o:["Yes, stream-static inner joins are supported and need no watermark","No, streams can only join streams","Only if the static side is cached","Only in complete mode"],
 e:"Each micro-batch is joined with the static data. Some outer joins with the static side on the wrong side are not supported."},
{s:"sp_ss",q:"Why do stream-stream joins usually need watermarks?",
 o:["So Spark can drop buffered rows that can no longer match and keep state bounded (outer joins require them)","To sort the output of the join by event time before it is written","To enable append mode on the sources, which otherwise only support update","They are only needed for Kafka sources, which do not keep event times"],
 e:"Both sides buffer rows waiting for matches. Watermarks plus a time-range condition tell Spark when a row can be discarded."},
{s:"sp_ss",q:"How do you remove duplicate events by event_id in a stream without keeping state forever?",
 o:["Add a watermark and deduplicate (dropDuplicates with the event-time column, or dropDuplicatesWithinWatermark)","Use distinct() without a watermark; Spark expires old state automatically","Use orderBy on event_id followed by limit to keep one row per id","Leave the stream as it is and deduplicate only in the sink table"],
 e:"Without a watermark the dedup state grows without bound."},
{s:"sp_ss",q:"What does window(col(\"ts\"), \"10 minutes\", \"5 minutes\") create?",
 o:["Sliding windows 10 minutes long that start every 5 minutes, so each event falls into two windows","Tumbling windows of 5 minutes that are reported every 10 minutes","Session windows that close after a 10 minute gap, checked every 5 minutes","A 10 minute watermark with a 5 minute allowed delay for late events"],
 e:"With one argument the window is tumbling. session_window groups events separated by less than a gap."},
{s:"sp_ss",q:"Reading JSON files with spark.readStream.json(path) fails asking for a schema. Why?",
 o:["File streaming sources need a schema up front (unless spark.sql.streaming.schemaInference is enabled)","JSON is not supported as a streaming source; convert the files to Parquet first","The path must point to a Kafka topic when reading JSON in streaming mode","Streaming only reads files written after the query starts, and none exist yet"],
 e:"A stream cannot scan all future files to infer types, so provide .schema(...) or enable inference explicitly."},
{s:"sp_ss",q:"Which option limits how much a file source reads per micro-batch?",
 o:["maxFilesPerTrigger","maxPartitionBytes","shuffle.partitions","checkpointInterval"],
 e:"For Kafka use maxOffsetsPerTrigger. Rate limits keep batches predictable after downtime."},
{s:"sp_ss",q:"How can you see the input rate and batch duration of a running query from code?",
 o:["query.lastProgress or query.recentProgress","query.explain()","spark.catalog.listTables()","df.printSchema()"],
 e:"Progress reports include numInputRows, inputRowsPerSecond, processedRowsPerSecond and durations. A StreamingQueryListener receives them as events."},
{s:"sp_ss",q:"Which state store provider keeps large streaming state off the JVM heap?",
 o:["RocksDB state store provider","HDFS-backed provider with more memory","The broadcast manager","The block manager's MEMORY_ONLY level"],
 e:"The default HDFSBackedStateStoreProvider keeps state in executor memory. RocksDB avoids GC pressure for big state."},
{s:"sp_ss",q:"An event arrives with an event time older than the current watermark of a windowed aggregation. What happens?",
 o:["It is dropped by the aggregation because its window may already be finalized","It reopens the window and updates the result","The query fails","It is buffered until the next day"],
 e:"Spark guarantees data within the watermark delay is processed; data older than the watermark may be ignored."},
{s:"sp_ss",q:"Which output mode is required to sort a streaming aggregation's result?",
 o:["complete","append","update","None; sorting is never allowed"],
 e:"Sorting a stream is only supported after an aggregation in complete mode, because the whole result is rewritten each trigger."},
{s:"sp_ss",q:"What does the rate source do?",
 o:["Generates rows with timestamp and value columns at a set rate, for testing","Limits the throughput of another source","Measures sink latency","Reads exchange rates"],
 e:"spark.readStream.format(\"rate\").option(\"rowsPerSecond\", 10) is handy for trying out streaming logic."},
{s:"sp_ss",q:"After a crash, a query restarts with the same checkpoint. Where does it continue?",
 o:["From the last committed offsets in the checkpoint, reprocessing an unfinished batch if needed","From startingOffsets again, as configured in the query options","From the beginning of the source, reprocessing everything to rebuild state","It cannot restart; a crashed query needs a new checkpoint location"],
 e:"Options such as startingOffsets only apply the first time a query starts with an empty checkpoint."},
/* ---- Apache Spark: data sources and formats ---- */
{s:"sp_io",q:"Why is Parquet usually faster to query than CSV?",
 o:["It is columnar and compressed, stores the schema and keeps min/max statistics that allow skipping data","It is a simple text format that is quick to parse line by line","It stores one file per row, so single rows can be read without scanning","It does not need a schema, which saves time when reading"],
 e:"Columnar layout enables column pruning, and row-group statistics enable predicate pushdown. CSV has to be parsed in full."},
{s:"sp_io",q:"What does option(\"header\", True) do when reading CSV?",
 o:["Uses the first line of each file as column names instead of data","Infers column types","Skips malformed lines","Adds a column with the file name"],
 e:"Without it, columns are named _c0, _c1 ... and the header line is read as data."},
{s:"sp_io",q:"Which CSV/JSON read mode stops the job at the first malformed record?",
 o:["FAILFAST","PERMISSIVE","DROPMALFORMED","IGNORE"],
 e:"PERMISSIVE (default) sets bad fields to NULL and can keep the raw line in columnNameOfCorruptRecord; DROPMALFORMED drops bad rows."},
{s:"sp_io",q:"In PERMISSIVE mode, how do you keep the raw text of rows that failed to parse?",
 o:["Add a string column named by columnNameOfCorruptRecord (default _corrupt_record) to the schema","Set mode to FAILFAST, which stores the bad line in the error message","Turn on inferSchema, which adds a column for lines it cannot type","Read the file twice and compare the row counts of both reads"],
 e:"Spark fills that column with the original line for malformed records, which lets you route them to a quarantine table."},
{s:"sp_io",q:"A JSON file contains one large object spread over many lines. Which option is needed?",
 o:["multiLine=True","lineSep=\"\\n\"","allowComments=True","samplingRatio=1.0"],
 e:"By default Spark expects JSON Lines: one complete object per line. multiLine parses whole files, which cannot be split across tasks."},
{s:"sp_io",q:"What is the default save mode of DataFrameWriter?",
 o:["errorifexists: fail if the target already exists","overwrite: replace whatever is at the target","append: add the new rows to the existing data","ignore: skip the write if the target exists"],
 e:"Set mode(\"overwrite\"), mode(\"append\") or mode(\"ignore\") explicitly when that is what you want."},
{s:"sp_io",q:"A job overwrites a table partitioned by date with data for one day. How do you replace only that day's partition, keeping the others?",
 o:["Set spark.sql.sources.partitionOverwriteMode to dynamic before the overwrite","Use mode(\"append\"), which replaces partitions that already exist","Use mode(\"ignore\"), which writes only partitions that are missing","Use coalesce(1), so only one partition is touched by the write"],
 e:"In the default static mode, an overwrite of a partitioned path removes all partitions first. Dynamic mode replaces only partitions present in the new data."},
{s:"sp_io",q:"Parquet files in one folder were written with slightly different schemas over time. How can Spark read a combined schema?",
 o:["option(\"mergeSchema\", True)","option(\"inferSchema\", True)","option(\"header\", True)","option(\"multiLine\", True)"],
 e:"Schema merging reads footers of all files and unions their columns. It is off by default because it is expensive."},
{s:"sp_io",q:"Which capability does Delta Lake add on top of Parquet files?",
 o:["ACID transactions through a transaction log, plus time travel and MERGE","A row-based file layout","Automatic CSV conversion","Encryption of every column by default"],
 e:"The _delta_log records each commit, so readers see consistent snapshots and you can query older versions."},
{s:"sp_io",q:"Reading a JDBC table with partitionColumn=\"id\", lowerBound=1, upperBound=1000 and numPartitions=10. What do the bounds do?",
 o:["They only decide the stride of the 10 range queries; rows outside the bounds are still read","They filter out rows whose id falls outside 1..1000","They limit the result to the first 1000 rows of the table","They set how many rows each partition fetches per round trip"],
 e:"The first and last partitions are open-ended. Add a WHERE clause (or a query option) if you actually want to filter."},
{s:"sp_io",q:"A parallel JDBC read is very slow because each round trip returns only 10 rows. Which option helps?",
 o:["fetchsize","numPartitions","batchsize","queryTimeout"],
 e:"fetchsize sets how many rows the driver fetches per round trip; some drivers default very low. batchsize applies to writes."},
{s:"sp_io",q:"What is the difference between df.write.saveAsTable(\"sales\") and df.write.parquet(\"/path\")?",
 o:["saveAsTable registers a table in the catalog (managed unless a path is given); parquet(path) only writes files","saveAsTable writes CSV files, while parquet(path) writes Parquet files","parquet(path) also registers a catalog table named after the folder","There is no difference; both create a managed table in the catalog"],
 e:"Tables can be queried by name with SQL and carry metadata. Writing to a path needs readers to know the path and format."},
{s:"sp_io",q:"How many files does a write usually create?",
 o:["At least one per task that writes non-empty data, so roughly one per partition (times partition folders when using partitionBy)","Exactly one file, which Spark merges from all tasks at the end","One file per executor, regardless of how many partitions there are","One file per column, since the default output format is columnar"],
 e:"Use repartition, coalesce or maxRecordsPerFile to control file count and size."},
{s:"sp_io",q:"Which write option caps the number of rows per output file?",
 o:["maxRecordsPerFile","maxPartitionBytes","recordsPerBatch","fileSize"],
 e:"Set it on the writer or with spark.sql.files.maxRecordsPerFile to avoid huge files from big partitions."},
{s:"sp_io",q:"What compression codec does Spark use for Parquet by default?",
 o:["snappy","gzip","none","lz4 for all formats"],
 e:"snappy balances speed and size. Change it with option(\"compression\", ...) or spark.sql.parquet.compression.codec."},
{s:"sp_io",q:"What does spark.read.text(path) return?",
 o:["A DataFrame with a single string column named value, one row per line","A DataFrame with one column per word","A list of strings","A DataFrame with columns inferred from the first line"],
 e:"Use it for unstructured logs, then parse with split or regexp_extract."},
{s:"sp_io",q:"Files are stored as /data/events/year=2024/month=05/part-0.parquet. What does spark.read.parquet(\"/data/events\") return?",
 o:["The file columns plus year and month columns discovered from the folder names","Only the columns stored inside the files; folder names are ignored","An error, because nested folders must be read one level at a time","One DataFrame per folder, which must be combined with union"],
 e:"Partition discovery turns key=value directories into columns and enables partition pruning on them."},
{s:"sp_io",q:"Which read options help load only some files from a deep folder tree?",
 o:["pathGlobFilter to match file names and recursiveFileLookup to search subfolders","maxFilesPerTrigger and checkpointLocation","mergeSchema and header","mode and columnNameOfCorruptRecord"],
 e:"pathGlobFilter=\"*.json\" filters names. recursiveFileLookup reads all subfolders but disables partition discovery."},
{s:"sp_io",q:"Which format reads files such as images or PDFs as raw bytes with path and modification time?",
 o:["binaryFile","text","image only","avro"],
 e:"spark.read.format(\"binaryFile\") returns path, modificationTime, length and content columns."},
{s:"sp_io",q:"What does mode(\"ignore\") do when the target already exists?",
 o:["Skips the write without error and leaves the existing data untouched","Appends the new rows to the existing data","Overwrites the existing data with the new rows","Raises an error saying the target already exists"],
 e:"It is like CREATE TABLE IF NOT EXISTS for data writes."},
{s:"sp_io",q:"Which formats are column-oriented?",
 o:["Parquet and ORC","CSV and JSON","Avro and CSV","Text and JSON"],
 e:"Avro is row-oriented with an embedded schema, which suits streaming and record-at-a-time writes."},
{s:"sp_io",q:"Why give a schema when reading many JSON files?",
 o:["Inference would read the data first to guess types, and inferred types can differ between runs","JSON cannot be read at all without an explicit schema","A schema turns on multiLine parsing automatically","A schema makes Spark write the data back out as Parquet"],
 e:"Providing a schema (or a DDL string such as \"id INT, name STRING\") is faster and keeps types stable."},

/* ---- Apache Spark: PySpark and UDFs ---- */
{s:"sp_py",q:"What return type does a Python UDF get if you do not declare one?",
 o:["StringType","The type of the input column","DoubleType","It is inferred from the first row"],
 e:"@udf without a returnType produces strings. Declare the type, for example @udf(returnType=\"int\")."},
{s:"sp_py",q:"Why are row-at-a-time Python UDFs slow?",
 o:["Each row is serialized from the JVM to a Python worker and back, and the optimizer cannot see inside the function","They run on the driver, so all data is sent there first","They disable caching for every DataFrame they touch","They can only run on one executor at a time"],
 e:"Arrow-optimized UDFs (useArrow=True) and pandas UDFs batch the data transfer; built-in functions avoid it entirely."},
{s:"sp_py",q:"Which pandas UDF type maps a Series to a Series of the same length?",
 o:["A scalar pandas UDF declared with type hints pd.Series -> pd.Series","applyInPandas","mapInPandas","A grouped aggregate UDF returning a scalar"],
 e:"The type hints tell Spark how to call the function. Series -> scalar is a grouped aggregate UDF."},
{s:"sp_py",q:"What does df.mapInPandas(func, schema) do?",
 o:["Calls func with an iterator of pandas DataFrames for each partition and builds a new DataFrame from what it yields","Applies func to each group produced by a preceding groupBy","Converts the whole DataFrame to one pandas DataFrame on the driver","Renames columns according to a mapping given as a pandas Series"],
 e:"The output can have any number of rows, which makes it useful for row expansion or calling a model on batches."},
{s:"sp_py",q:"What is a risk of groupBy(\"key\").applyInPandas(func, schema)?",
 o:["Each whole group is loaded into memory as one pandas DataFrame, so a very large group can run out of memory","It cannot add new columns; the output schema must match the input","It runs on the driver, so all groups are processed one after another","It drops the group key from the output unless it is listed twice"],
 e:"Grouped map works per group, so skewed keys become memory problems on one Python worker."},
{s:"sp_py",q:"Which setting speeds up df.toPandas() by transferring data in columnar batches?",
 o:["spark.sql.execution.arrow.pyspark.enabled=true","spark.sql.adaptive.enabled=true","spark.serializer=Kryo","spark.python.worker.reuse=false"],
 e:"Arrow avoids row-by-row conversion. toPandas still collects everything to the driver, so the result must fit there."},
{s:"sp_py",q:"What is pyspark.pandas?",
 o:["The pandas API on Spark: pandas-like syntax executed as distributed Spark jobs","A pandas UDF decorator","A tool that converts Spark DataFrames to pandas on the driver","A plotting library"],
 e:"It lets pandas users scale code with few changes. Some operations (for example those needing a global order) can be costly."},
{s:"sp_py",q:"A Python UDF fails with TypeError on some rows. What is a likely reason?",
 o:["The input column has NULLs, which arrive as None and must be handled in the function","UDFs cannot take numeric arguments; values must be cast to strings first","The UDF ran on the driver for those rows and lost its imports","The DataFrame was cached, and cached rows are passed as bytes"],
 e:"Guard with if x is None: return None, or filter NULLs before calling the UDF."},
{s:"sp_py",q:"Why can a filter on a UDF's result not be pushed down to a Parquet scan?",
 o:["The UDF is opaque to Catalyst, so Spark cannot translate the condition into a source filter","Parquet does not support filters at all; pushdown only works for JDBC","UDFs always run after the write, so their filters apply to the output","Pushdown is only available for CSV sources, not columnar ones"],
 e:"Express conditions with built-in functions when possible so they can be pushed down and optimized."},
{s:"sp_py",q:"How do you make a Python function callable from spark.sql queries?",
 o:["spark.udf.register(\"clean_name\", clean_name, \"string\")","spark.sql.register(clean_name)","F.udf(clean_name).sql()","spark.catalog.createFunction(clean_name)"],
 e:"register returns the UDF and makes it available by name in SQL for the session."},
{s:"sp_py",q:"Why does df.filter(col(\"age\") > 18 and col(\"country\") == \"IN\") raise an error?",
 o:["Python's and tries to turn a Column into a bool; use & with each condition in parentheses","Columns cannot be compared to strings; country must be cast first","filter accepts only SQL strings, never Column expressions","and is only allowed between numeric columns, not strings"],
 e:"Write (col(\"age\") > 18) & (col(\"country\") == \"IN\"). Use | for or and ~ for not."},
{s:"sp_py",q:"Which expression keeps rows whose status is 'new' or 'open'?",
 o:["col(\"status\").isin(\"new\", \"open\")","col(\"status\") in [\"new\", \"open\"]","col(\"status\").contains([\"new\", \"open\"])","col(\"status\") == [\"new\", \"open\"]"],
 e:"isin builds an IN expression. Python's in operator would try to evaluate the Column as a bool."},
{s:"sp_py",q:"Why is df.rdd.map(lambda r: ...) usually slower than a DataFrame expression?",
 o:["Every row is converted to a Python Row object and the work leaves Catalyst and Tungsten","RDD operations cannot run in parallel across executors","The lambda runs on the driver for every row","It requires the Kryo serializer, which is slower than Java serialization"],
 e:"Converting to RDDs gives up whole-stage codegen and the compact binary format. Stay in the DataFrame API when you can."},
{s:"sp_py",q:"Given row = df.first(), which expressions read the name field?",
 o:["row.name or row[\"name\"]","row.get(\"name\") only","row(\"name\")","row.select(\"name\")"],
 e:"Row supports attribute and key access, plus positional access row[0]. row.asDict() returns a dict."},
{s:"sp_py",q:"Which call creates a DataFrame from a list of tuples with typed columns?",
 o:["spark.createDataFrame([(1, \"a\")], \"id INT, label STRING\")","spark.read.list([(1, \"a\")], schema=\"id INT, label STRING\")","spark.range([(1, \"a\")]).toDF(\"id INT\", \"label STRING\")","spark.sql([(1, \"a\")], \"id INT, label STRING\")"],
 e:"createDataFrame accepts a DDL schema string, a StructType or a list of column names."},
{s:"sp_py",q:"What does spark.range(5) produce?",
 o:["A DataFrame with one bigint column id containing 0 to 4","A Python range object","A list of 5 Rows","A DataFrame with 5 empty columns"],
 e:"range(start, end, step, numPartitions) is a quick way to generate test data."},
{s:"sp_py",q:"In a pandas UDF, what tells Spark the function's input and output kinds?",
 o:["Python type hints such as pd.Series -> pd.Series, or Iterator[pd.Series] -> Iterator[pd.Series]","The function name, which must end in _series or _frame","A comment on the first line of the function body","Only the order of the arguments in the function signature"],
 e:"Since Spark 3.0, type hints replace the old PandasUDFType constants."},
{s:"sp_py",q:"What does an iterator-of-Series pandas UDF (Iterator[pd.Series] -> Iterator[pd.Series]) allow?",
 o:["Doing expensive setup, such as loading a model, once per partition and reusing it for every batch","Returning a different number of rows than the input","Reading other partitions","Running on the driver"],
 e:"The function runs once per partition and loops over batches, so initialization cost is paid once."},
{s:"sp_py",q:"How do you ship a large read-only Python dict to all executors efficiently in RDD code?",
 o:["lookup = spark.sparkContext.broadcast(my_dict) and use lookup.value inside tasks","Capture my_dict in every lambda; Spark sends it once per executor anyway","Register it as a temp view and query it from each task","Wrap it in an accumulator so every task can read the same copy"],
 e:"Without broadcasting, the dict is serialized into every task closure."},
{s:"sp_py",q:"What does df.collect() return in PySpark?",
 o:["A Python list of Row objects","A pandas DataFrame","A new DataFrame","A generator that streams rows lazily"],
 e:"toLocalIterator streams partitions one at a time if you must iterate over a large result on the driver."},
{s:"sp_py",q:"What does setting useArrow=True on a Python UDF (Spark 3.5+) change?",
