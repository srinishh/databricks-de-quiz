 o:["Rows are exchanged with Python in Arrow batches, which is usually faster than pickling row by row","The UDF is translated to JVM code and no longer uses Python workers","The UDF becomes a pandas UDF that receives whole Series instead of values","The UDF's results are cached so repeated calls with the same input are skipped"],
 e:"The function is still called per row, but data transfer and type conversion use Arrow."},

/* ---- Apache Spark: problems ---- */
{s:"sp_prob",q:"What does this print?",c:"df = spark.range(10)\nevens = df.filter(\"id % 2 = 0\")\nprint(evens.count())",
 o:["5","10","4","6"],
 e:"range(10) is 0..9; the even ids are 0, 2, 4, 6, 8."},
{s:"sp_prob",q:"What does this print?",c:"df = spark.range(0, 100, 1, 4)\nprint(df.coalesce(8).rdd.getNumPartitions())",
 o:["4","8","12","200"],
 e:"coalesce can only reduce the partition count. To go from 4 to 8, use repartition(8), which shuffles."},
{s:"sp_prob",q:"What goes wrong here?",c:"a = spark.createDataFrame([(1, \"x\")], [\"id\", \"name\"])\nb = spark.createDataFrame([(\"y\", 2)], [\"name\", \"id\"])\na.union(b).show()",
 o:["union matches columns by position, so b's name lands under id and its id under name (or the union fails on the type mismatch); use unionByName","Nothing; union matches columns by name, so both rows line up correctly","The duplicate id column across both DataFrames raises an ambiguity error","union removes the row from b because its columns are in a different order"],
 e:"unionByName lines columns up by name, which is safer whenever column order can differ."},
{s:"sp_prob",q:"What does this print?",c:"df = spark.createDataFrame([(1,), (2,), (None,)], \"x INT\")\nprint(df.filter(F.col(\"x\") != 1).count())",
 o:["1","2","3","0"],
 e:"NULL != 1 is NULL, which filter treats as false. To keep NULLs too, add | F.col(\"x\").isNull()."},
{s:"sp_prob",q:"What does this return?",c:"df = spark.createDataFrame([(1,), (None,), (3,)], \"v INT\")\ndf.select(F.sum(\"v\")).first()[0]",
 o:["4","NULL (None)","0","An error"],
 e:"sum skips NULLs. Only when every value is NULL does sum return NULL."},
{s:"sp_prob",q:"What does this print?",c:"df = spark.createDataFrame(\n    [(1, [\"a\", \"b\"]), (2, []), (3, None)],\n    \"id INT, tags ARRAY<STRING>\")\nprint(df.select(F.explode(\"tags\")).count(),\n      df.select(F.explode_outer(\"tags\")).count())",
 o:["2 4","2 2","4 4","3 4"],
 e:"explode yields a and b only. explode_outer also emits one NULL row each for the empty and the NULL array."},
{s:"sp_prob",q:"What does this print?",c:"df = spark.createDataFrame([(1, \"a\"), (1, \"b\"), (2, \"c\")], [\"id\", \"v\"])\nprint(df.dropDuplicates([\"id\"]).count(), df.distinct().count())",
 o:["2 3","2 2","3 3","1 3"],
 e:"dropDuplicates on id keeps one row per id. distinct compares all columns, and all three rows differ."},
{s:"sp_prob",q:"What does this print?",c:"sc = spark.sparkContext\nacc = sc.accumulator(0)\ndef f(x):\n    acc.add(1)\n    return x\nrdd = sc.parallelize(range(10)).map(f)\nrdd.count()\nrdd.count()\nprint(acc.value)",
 o:["20","10","0","40"],
 e:"The RDD is not cached, so the map runs again for the second action and the accumulator counts twice. Updates in transformations are not deduplicated."},
{s:"sp_prob",q:"Same code, but with .cache() added after map(f). Assuming no task failures, what does it print?",c:"rdd = sc.parallelize(range(10)).map(f).cache()\nrdd.count()\nrdd.count()\nprint(acc.value)",
 o:["10","20","0","1"],
 e:"The first action computes and caches the partitions; the second reads the cache, so f is not called again."},
{s:"sp_prob",q:"How many part files does this write (ignoring _SUCCESS and other metadata files)?",c:"(spark.range(1_000_000)\n    .repartition(4)\n    .write.mode(\"overwrite\")\n    .parquet(\"/tmp/out\"))",
 o:["4","1","200","8"],
 e:"Each of the 4 non-empty partitions is written by one task as one file (unless maxRecordsPerFile splits them)."},
{s:"sp_prob",q:"The DataFrame has rows for countries IN and US. What layout does this produce?",c:"df.write.partitionBy(\"country\").parquet(\"/data/sales\")",
 o:["Folders /data/sales/country=IN/ and /data/sales/country=US/, and the files inside do not contain the country column","Two files named IN.parquet and US.parquet","One file with rows sorted by country","Folders named IN and US, each with a country column in the files"],
 e:"The partition value is stored in the folder name. Spark adds it back as a column when reading the root path."},
{s:"sp_prob",q:"This line raises ValueError: Cannot convert column into bool. How do you fix it?",c:"df.filter(F.col(\"age\") > 18 and F.col(\"country\") == \"IN\")",
 o:["df.filter((F.col(\"age\") > 18) & (F.col(\"country\") == \"IN\"))","df.filter(F.col(\"age\") > 18 && F.col(\"country\") == \"IN\")","df.filter(bool(F.col(\"age\") > 18))","df.filter([F.col(\"age\") > 18, F.col(\"country\") == \"IN\"])"],
 e:"Column conditions are combined with &, | and ~, each comparison wrapped in parentheses. A SQL string \"age > 18 AND country = 'IN'\" also works."},
{s:"sp_prob",q:"This filter does not do what was intended. Why?",c:"df.filter(F.col(\"a\") > 1 & F.col(\"b\") < 5)",
 o:["& binds more tightly than > and <, so Python evaluates 1 & F.col(\"b\") first; wrap each comparison in parentheses","& means OR in PySpark, so rows matching either condition are kept","Columns cannot be compared with numbers without an explicit cast","filter accepts only one condition; the second one is ignored"],
 e:"Correct: df.filter((F.col(\"a\") > 1) & (F.col(\"b\") < 5))."},
{s:"sp_prob",q:"This loop makes the job spend minutes before the first task even starts. Why, and what is the fix?",c:"for i in range(500):\n    df = df.withColumn(f\"f{i}\", F.col(\"x\") * i)",
 o:["Each withColumn adds a projection, so the plan grows huge and slow to analyze; build the 500 expressions and add them in one select","The loop runs 500 separate jobs; add cache() after each withColumn","Multiplication is slow on bigint columns; use a Python UDF instead","Each withColumn shuffles the data; call coalesce after the loop"],
 e:"df.select(\"*\", *[(F.col(\"x\") * i).alias(f\"f{i}\") for i in range(500)]) creates one projection."},
{s:"sp_prob",q:"The driver crashes with OutOfMemoryError on this code over 500 million rows. What is the right fix?",c:"rows = big_df.collect()\nfor r in rows:\n    send_to_api(r)",
 o:["Do the work on executors, for example big_df.foreachPartition(send_partition), or write the data out","Increase spark.sql.shuffle.partitions so collect returns smaller pieces","Call big_df.cache() before collect() so the rows come from executor memory","Use take(500_000_000) instead, which streams rows instead of loading them"],
 e:"collect brings every row into driver memory. foreachPartition runs the sending code in parallel on executors, ideally with one connection per partition."},
{s:"sp_prob",q:"What is this code doing?",c:"N = 8\nsalted = facts.withColumn(\"salt\", (F.rand() * N).cast(\"int\"))\ndims_n = dims.crossJoin(spark.range(N).withColumnRenamed(\"id\", \"salt\"))\nout = salted.join(dims_n, [\"key\", \"salt\"])",
 o:["Salting a skewed join: each key's fact rows spread over 8 values, and dims is copied 8 times so every row still finds its match","Sampling about one eighth of the facts and joining the sample to dims","Encrypting the join key with a random salt before sending it over the network","Broadcasting dims to 8 executors and splitting facts evenly between them"],
 e:"A hot key is now handled by up to 8 tasks instead of one. The cost is an 8x larger dims side."},
{s:"sp_prob",q:"customers has ids 1, 2, 3. orders has customer ids 1, 1, 3. How many rows does this return?",c:"customers.join(orders, \"id\", \"left\").count()",
 o:["4","3","5","6"],
 e:"Id 1 matches twice (2 rows), id 2 has no match (1 row with NULL order columns), id 3 matches once (1 row)."},
{s:"sp_prob",q:"customers has ids 1, 2, 3. orders has customer ids 1, 3, 3. What does this return?",c:"customers.join(orders, \"id\", \"left_anti\").select(\"id\").collect()",
 o:["[Row(id=2)]","[Row(id=1), Row(id=3)]","[Row(id=1), Row(id=3), Row(id=3)]","[]"],
 e:"left_anti keeps left rows without any match."},
{s:"sp_prob",q:"What does this print?",c:"a = spark.createDataFrame([(1,), (None,)], \"k INT\")\nb = spark.createDataFrame([(1,), (None,)], \"k INT\")\nprint(a.join(b, a.k == b.k).count(),\n      a.join(b, a.k.eqNullSafe(b.k)).count())",
 o:["1 2","2 2","1 1","2 1"],
 e:"With ==, NULL never equals NULL. eqNullSafe (<=>) treats two NULLs as a match."},
{s:"sp_prob",q:"Starting this streaming query fails. Why?",c:"counts = events.groupBy(\"user\").count()\n(counts.writeStream\n    .outputMode(\"append\")\n    .format(\"console\")\n    .start())",

function examSummary(sections){
  var ids={},sec={},seen=0,ok=0,total=0;
  sections.forEach(function(s){ids[s.id]=1;sec[s.id]={t:0,n:0,ok:0}});
  QUESTIONS.forEach(function(q){
    if(!ids[q.s])return;
    var st=store.stats[q.id],b=sec[q.s];b.t++;total++;

function setAll(v){Array.prototype.forEach.call(document.querySelectorAll(".secbox"),function(b){b.checked=v})}
function chosen(){return Array.prototype.filter.call(document.querySelectorAll(".secbox"),function(b){return b.checked}).map(function(b){return b.value})}
function setErr(m){var e=document.getElementById("err");if(e)e.textContent=m}

/* ---------- sessions ---------- */
function mkItem(q){
  var opts=shuffle(q.o.map(function(t,i){return {t:t,ok:i===0}}));
  return {q:q,opts:opts,pick:null,done:false};
}
function begin(mode,qs,limit){
  ses={mode:mode,items:qs.map(mkItem),i:0,limit:limit||0,t0:Date.now(),quit:false,remaining:limit||0};
  view="quiz";selected=null;stopTimer();
  if(ses.limit){timer=setInterval(function(){
    ses.remaining=ses.limit-Math.floor((Date.now()-ses.t0)/1000);
    var el=document.getElementById("timer");
    if(el){el.textContent=clock(ses.remaining);el.classList.toggle("low",ses.remaining<=300)}
    if(ses.remaining<=0)finish();
  },1000)}
  quiz();
}
function startPractice(kind){
  var ids=chosen();
  if(!ids.length){setErr("Select at least one section.");return}
  var pool=all().filter(function(q){
    if(ids.indexOf(q.s)<0)return false;
    if(kind==="repeat")return !!store.exam[q.id];
    if(kind==="missed"){var s=store.stats[q.id];return s&&!s.ok}
    return true;
  });
  if(!pool.length){
    setErr(kind==="missed"?"Nothing to revisit in these sections yet. Answer some questions first.":
           kind==="repeat"?"No questions marked as seen in your exam in these sections. Tick the exam box on a question to mark it.":
           "No questions in this selection.");
    return;
  }
  var n=parseInt(document.getElementById("count").value,10);
  pool=shuffle(pool);if(n>0)pool=pool.slice(0,n);
  begin(kind==="missed"?"Revisit":kind==="repeat"?"Exam repeats":"Practice",pool,0);
}
function startExam(){
  var E=EXAMS[curExam],Q=all(),pick=[],rest=[];
  SECTIONS.forEach(function(sc){
    var pool=shuffle(Q.filter(function(q){return q.s===sc.id}));
    pick=pick.concat(pool.slice(0,sc.n));rest=rest.concat(pool.slice(sc.n));
  });
  var need=E.total-pick.length;
  if(need>0)pick=pick.concat(shuffle(rest).slice(0,need));
  begin("Mock exam",shuffle(pick),Math.round(pick.length*E.minutes*60/E.total));
}

/* ---------- quiz view ---------- */
function quiz(){
  var it=ses.items[ses.i],n=ses.items.length,exam=ses.mode==="Mock exam";
  var answered=it.pick!==null;
  var optsHtml=it.opts.map(function(o,i){
    var cls="opt";
    if(exam){if(it.pick===i)cls+=" sel"}
    else if(it.done){
      if(o.ok)cls+=" ok";else if(it.pick===i)cls+=" no";else cls+=" dim";
    }
    return '<button type="button" class="'+cls+'" data-i="'+i+'"'+((!exam&&it.done)?' disabled':'')+'><span class="k">'+LETTERS[i]+'</span><span class="t">'+fmt(o.t)+'</span></button>';
  }).join("");

  var fb="";
  if(!exam&&it.done){
    var good=it.opts[it.pick].ok;
    fb='<div class="verdict '+(good?'ok':'no')+'">'+(good?'Correct.':'Not quite.')+'</div>'+(it.q.e?'<p>'+fmt(it.q.e)+'</p>':'');
  }
  var last=ses.i===n-1;
  var nextLabel=last?"Finish":"Next";
  var canNext=exam?answered:it.done;

  app.innerHTML=
    '<div class="topbar"><div class="left"><span class="label">'+esc(ses.mode)+'</span><span class="label">Question '+(ses.i+1)+' / '+n+'</span></div>'+
    '<div class="left">'+(ses.limit?'<span class="timer'+(ses.remaining<=300&&ses.remaining>0?' low':'')+'" id="timer">'+clock(ses.limit-Math.floor((Date.now()-ses.t0)/1000))+'</span>':'')+
    '<button class="btn link" id="quit" type="button">'+(ses.quit?'Click again to end now':'End round')+'</button></div></div>'+
    '<div class="prog"><i style="width:'+Math.round(100*(ses.i+(canNext?1:0))/n)+'%"></i></div>'+
    '<section class="qcard"><div class="cardhead"><p class="label chip" style="--c:'+SEC[it.q.s].c+'">'+esc(SEC[it.q.s].name)+(it.q.custom?'<span class="tag">yours</span>':'')+'</p>'+
    '<button type="button" class="flag" id="flag" aria-pressed="'+(!!store.exam[it.q.id])+'"><span class="box">'+(store.exam[it.q.id]?"\u2713":"")+'</span>Came up in my exam</button></div>'+
    '<h2 class="qtext">'+fmt(it.q.q)+'</h2>'+
    (it.q.c?'<pre class="code"><code>'+esc(it.q.c)+'</code></pre>':'')+
    tagControl(it.q)+
    '<div class="opts" role="group" aria-label="Answer options">'+optsHtml+'</div>'+
    '<div class="fb" aria-live="polite">'+fb+'</div>'+
    '<div class="actions"><button class="btn primary" id="next" type="button"'+(canNext?'':' disabled')+'>'+nextLabel+'</button>'+
    '<span class="small">Keys: A-D to answer, N for next</span></div></section>';

  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){
    b.onclick=function(){choose(parseInt(b.getAttribute("data-i"),10))};
  });
  document.getElementById("next").onclick=next;
  document.getElementById("flag").onclick=function(){toggleFlag(it.q.id);quiz()};
  document.getElementById("quit").onclick=function(){
    if(!ses.quit){ses.quit=true;quiz();return}
    finish();
  };
}
function choose(i){
  var it=ses.items[ses.i],exam=ses.mode==="Mock exam";
  if(!exam&&it.done)return;
  it.pick=i;
  if(!exam){it.done=true;record(it.q,it.opts[i].ok);save()}
  ses.quit=false;
  quiz();
}
function next(){
  var exam=ses.mode==="Mock exam",it=ses.items[ses.i];
  if(exam?it.pick===null:!it.done)return;
  if(ses.i>=ses.items.length-1){finish();return}
  ses.i+=1;ses.quit=false;quiz();
  window.scrollTo(0,0);
}
app.addEventListener("click",function(e){
  if(view!=="quiz"&&view!=="result")return;
  var b=e.target.closest("button");if(b)tagClick(b,quiz);
});
document.addEventListener("keydown",function(e){
  if(view!=="quiz"||!ses||overlayEl||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  var k=e.key.toLowerCase(),idx=["a","b","c","d","1","2","3","4"].indexOf(k);
  if(idx>=0){var i=idx%4;if(i<ses.items[ses.i].opts.length)choose(i);return}
  if(k==="n"||k==="arrowright")next();
});

/* ---------- results ---------- */
function finish(){
  stopTimer();
  var exam=ses.mode==="Mock exam";
  var items=ses.items;
  if(exam)items.forEach(function(it){if(it.pick!==null){record(it.q,it.opts[it.pick].ok)}});
  var answered=items.filter(function(it){return it.pick!==null});
  var scope=exam?items:answered;
  if(!scope.length){home();return}
  var right=scope.filter(function(it){return it.pick!==null&&it.opts[it.pick].ok}).length;
  store.history.push({t:Date.now(),mode:ses.mode,right:right,total:scope.length,x:curExam});
  store.rounds=(store.rounds||0)+1;
  if(exam){var mp=pct(right,scope.length),mk=MOCK_KEY[curExam];if(!(store[mk]>=mp))store[mk]=mp}
  store.history=store.history.slice(-30);
  save();
  view="result";

  var by={};
  scope.forEach(function(it){
    var b=by[it.q.s]||(by[it.q.s]={r:0,t:0});
    b.t++;if(it.pick!==null&&it.opts[it.pick].ok)b.r++;
  });
  var brk=SECTIONS.filter(function(s){return by[s.id]}).map(function(s){
    var b=by[s.id];
    return '<span>'+esc(s.name)+'</span><span class="bar" aria-hidden="true"><i style="width:'+pct(b.r,b.t)+'%;background:'+s.c+'"></i></span><span class="num small">'+b.r+'/'+b.t+'</span>';
  }).join("");

  var wrong=scope.filter(function(it){return it.pick===null||!it.opts[it.pick].ok});
  var rev=wrong.map(function(it){
    var correct=it.opts.filter(function(o){return o.ok})[0];
    return '<details><summary>'+fmt(it.q.q)+'</summary><div class="body">'+
      (it.q.c?'<pre class="code"><code>'+esc(it.q.c)+'</code></pre>':'')+
      '<p class="ans"><b class="badc">Your answer:</b> '+(it.pick===null?'not answered':fmt(it.opts[it.pick].t))+'</p>'+
      '<p class="ans"><b class="good">Correct answer:</b> '+fmt(correct.t)+'</p>'+
      '<p class="ans">'+fmt(it.q.e)+'</p>'+
      (tagOf(it.q.id)?'<div class="tagrow"><button type="button" class="ntag" data-ntagopen="'+it.q.id+'">📝 '+esc(tagOf(it.q.id).label)+'</button></div>':'')+
      '</div></details>';
  }).join("");

  var secs=Math.floor((Date.now()-ses.t0)/1000);
  app.innerHTML=
    '<p class="label">'+esc(ses.mode)+' &middot; '+clock(secs)+'</p>'+
    '<div class="score" style="margin-top:10px">'+pct(right,scope.length)+'%</div>'+
    '<p class="lede" style="margin-top:8px">'+right+' of '+scope.length+' correct.'+(wrong.length?' Review the '+wrong.length+' you missed below.':' Clean sweep.')+'</p>'+
    '<h2 style="margin-top:30px">By section</h2><div class="brk">'+brk+'</div>'+
    '<div class="actions" style="margin-top:28px"><button class="btn primary" id="again" type="button">New round</button></div>'+
    (wrong.length?'<h2 style="margin-top:34px">Missed questions</h2><div class="rev">'+rev+'</div>':'');
  document.getElementById("again").onclick=home;
  window.scrollTo(0,0);
}

/* ---------- question bank ---------- */
var bankTab="browse",editing=null,bankQuery="",bankSec="",delArm=null,flashMsg="",formFlag=false,formSec=SECTIONS[0].id;
function toggleFlag(id){if(store.exam[id])delete store.exam[id];else store.exam[id]={t:Date.now()};save()}
function qRow(q){
  var on=!!store.exam[q.id];
  var act='<button type="button" class="flag" data-flag="'+q.id+'" aria-pressed="'+on+'"><span class="box">'+(on?"\u2713":"")+'</span>Came up in my exam</button>';
  if(q.custom){act+='<button type="button" class="btn link" data-edit="'+q.id+'">Edit</button><button type="button" class="btn link" data-del="'+q.id+'">'+(delArm===q.id?"Sure? Delete":"Delete")+'</button>'}
  return '<div class="qrow"><span class="meta">'+esc(SEC[q.s]?SEC[q.s].name:q.s)+(q.custom?'<span class="tag">yours</span>':'')+'</span><span class="qt">'+fmt(q.q)+'</span><span class="rowact">'+act+'</span>'+tagControl(q)+'</div>';
}
function secOptions(sel,withAll){
  return (withAll?'<option value="">All sections</option>':'')+SECTIONS.map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(s.name)+'</option>'}).join("");
}
function formHtml(){
  var opts=[0,1,2,3].map(function(i){
    return '<div class="optrow"><input type="radio" name="correct" id="f-c'+i+'" value="'+i+'" aria-label="Option '+LETTERS[i]+' is the correct answer"><input type="text" id="f-o'+i+'" placeholder="Option '+LETTERS[i]+(i<2?' (required)':' (optional)')+'" autocomplete="off"></div>';
  }).join("");
  return '<div class="field"><label for="f-sec">Section</label><select id="f-sec">'+secOptions(formSec,false)+'</select></div>'+
    '<div class="field"><label for="f-q">Question</label><textarea id="f-q" placeholder="Write the question as you remember it"></textarea></div>'+
    '<div class="field"><label for="f-code">Code or query shown with the question (optional)</label><textarea id="f-code" class="mono" spellcheck="false"></textarea></div>'+
    '<div class="field"><span class="lbl">Answer options. Select the circle next to the correct one.</span>'+opts+'</div>'+
    '<div class="field"><label for="f-exp">Explanation (optional)</label><textarea id="f-exp" placeholder="Why the answer is right, or what to remember"></textarea></div>'+
    '<div class="field"><button type="button" class="flag" id="f-flag" aria-pressed="'+formFlag+'" style="justify-self:start"><span class="box">'+(formFlag?"\u2713":"")+'</span>Came up in my exam</button></div>'+
    '<div class="actions"><button class="btn primary" id="f-save" type="button">'+(editing?'Save changes':'Add question')+'</button>'+(editing?'<button class="btn" id="f-cancel" type="button">Cancel</button>':'')+'<span class="ok-note" id="f-msg" role="status"></span></div>'+
    '<p class="err" id="f-err" role="alert"></p>';
}
function fillList(){
  var el=document.getElementById("blist");if(!el)return;
  var Q=all(),list,cap=80;
  if(bankTab==="flagged")list=Q.filter(function(q){return store.exam[q.id]});
  else{var t=bankQuery.toLowerCase();list=Q.filter(function(q){return (!bankSec||q.s===bankSec)&&(!t||(q.q+" "+(q.c||"")).toLowerCase().indexOf(t)>=0)})}
  var html=list.slice(0,cap).map(qRow).join("");
  if(!list.length)html='<p class="small" style="margin-top:16px">'+(bankTab==="flagged"?"Nothing marked yet. Tick \u201cCame up in my exam\u201d on any question, here or while practising.":"No questions match.")+'</p>';
  else if(list.length>cap)html+='<p class="small" style="margin-top:12px">Showing the first '+cap+' of '+list.length+'. Narrow the search to see more.</p>';
  el.innerHTML=html;
}
function bank(){
  stopTimer();view="bank";ses=null;
  var Q=all(),nf=Q.filter(function(q){return store.exam[q.id]}).length;
  var tabs=[["browse","Browse"],["add",editing?"Edit question":"Add question"],["flagged","Seen in exam ("+nf+")"]];
  var h='<button class="btn link" id="back" type="button">&larr; Back</button>'+
    '<h1 style="font-size:clamp(1.7rem,6vw,2.4rem);margin-top:8px">Question bank</h1>'+
    '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab" role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(bankTab===t[0])+'">'+esc(t[1])+'</button>'}).join("")+'</div>';
  if(bankTab==="browse"){
    h+='<div class="controls"><div class="field" style="margin:0;flex:1 1 220px"><label for="bq">Search</label><input type="search" id="bq" placeholder="Type part of a question" autocomplete="off"></div>'+
       '<div class="field" style="margin:0"><label for="bsec">Section</label><select id="bsec">'+secOptions(bankSec,true)+'</select></div></div><div id="blist"></div>';
  }else if(bankTab==="add"){h+=formHtml()}
  else{h+='<p class="lede">Questions you marked as having come up in your real exam. Tick the same box while practising, or from Browse, and use the Exam repeats mode on the home screen to drill them.</p><div id="blist"></div>'}
  app.innerHTML=h;

  if(bankTab==="browse"){
    var bq=document.getElementById("bq"),bs=document.getElementById("bsec");
    bq.value=bankQuery;
    bq.oninput=function(){bankQuery=bq.value;fillList()};
    bs.onchange=function(){bankSec=bs.value;fillList()};
    fillList();
  }else if(bankTab==="flagged"){fillList()}
  else{fillForm()}
}
function fillForm(){
  var q=null;
  if(editing){store.custom.forEach(function(c){if(c.id===editing)q=c})}
  if(q){
    document.getElementById("f-sec").value=q.s;
    document.getElementById("f-q").value=q.q;
    document.getElementById("f-code").value=q.c||"";
    q.o.forEach(function(t,i){if(i<4)document.getElementById("f-o"+i).value=t});
    document.getElementById("f-exp").value=q.e||"";
    document.getElementById("f-c0").checked=true;
  }
  var fl=document.getElementById("f-flag");
  fl.onclick=function(){formFlag=!formFlag;fl.setAttribute("aria-pressed",String(formFlag));fl.querySelector(".box").textContent=formFlag?"\u2713":""};
  document.getElementById("f-save").onclick=saveForm;
  var c=document.getElementById("f-cancel");
  if(c)c.onclick=function(){editing=null;bankTab="browse";bank()};
  document.getElementById("f-sec").onchange=function(e){formSec=e.target.value};
  document.getElementById("f-msg").textContent=flashMsg;flashMsg="";
}
function saveForm(){
  var err=document.getElementById("f-err");err.textContent="";
  var qt=document.getElementById("f-q").value.trim();
  if(!qt){err.textContent="Write the question first.";return}
  var texts=[0,1,2,3].map(function(i){return document.getElementById("f-o"+i).value.trim()});
  if(texts.filter(Boolean).length<2){err.textContent="Add at least two answer options.";return}
  var cr=document.querySelector('input[name="correct"]:checked');
  if(!cr||!texts[+cr.value]){err.textContent="Select the circle next to the correct option, and fill that option in.";return}
  var ci=+cr.value,o=[texts[ci]];
  texts.forEach(function(t,i){if(t&&i!==ci)o.push(t)});
  var sec=document.getElementById("f-sec").value;formSec=sec;
  var rec={s:sec,q:qt,o:o,e:document.getElementById("f-exp").value.trim(),custom:true};
  var code=document.getElementById("f-code").value.replace(/\s+$/,"");
  if(code.trim())rec.c=code;
  if(editing){
    rec.id=editing;
    store.custom=store.custom.map(function(c){return c.id===editing?rec:c});
  }else{
    rec.id="c"+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36);
    store.custom.push(rec);
  }
  if(formFlag)store.exam[rec.id]={t:Date.now()};else delete store.exam[rec.id];
  save();
  if(editing){editing=null;formFlag=false;bankTab="browse";bank()}
  else{formFlag=false;flashMsg="Saved. Add another, or open Browse to see it.";bank()}
}
app.addEventListener("click",function(e){
  if(view!=="bank")return;
  var b=e.target.closest("button");if(!b)return;
  if(tagClick(b,fillList))return;
  if(b.id==="back"){editing=null;home();return}
  if(b.hasAttribute("data-tab")){
    var t=b.getAttribute("data-tab");
    if(t!=="add"){editing=null}
    bankTab=t;delArm=null;bank();return;
  }
  if(b.hasAttribute("data-flag")){toggleFlag(b.getAttribute("data-flag"));bank();return}
  if(b.hasAttribute("data-edit")){
    editing=b.getAttribute("data-edit");
    var rec=null;store.custom.forEach(function(c){if(c.id===editing)rec=c});
    formFlag=!!store.exam[editing];if(rec)formSec=rec.s;
    bankTab="add";delArm=null;bank();return;
  }
  if(b.hasAttribute("data-del")){
    var id=b.getAttribute("data-del");
    if(delArm===id){
      store.custom=store.custom.filter(function(c){return c.id!==id});
      delete store.stats[id];delete store.exam[id];delArm=null;save();
    }else{delArm=id}
    bank();return;
  }
});

/* ---------- group progress ---------- */
function ago(ts){
  var m=Math.round((Date.now()-ts)/60000);
  if(!(m>=0))return "";
  if(m<1)return "just now";
  if(m<60)return m+" min ago";
  var h=Math.round(m/60);
  if(h<48)return h+" h ago";
  return Math.round(h/24)+" days ago";
}
function renderGroup(docs){
  lastDocs=docs;

/* ---------- notes ----------
   store.notes = [{id, t, subs:[{id, t, b, imgs:[{d:driveFileId} | {src:dataUrl}]}]}]
   store.tags[questionId] = {h:headingId, s:subheadingId or ""} */
function nid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36)}
function findHeading(id){for(var i=0;i<store.notes.length;i++)if(store.notes[i].id===id)return store.notes[i];return null}
function findSub(h,id){if(!h)return null;for(var i=0;i<h.subs.length;i++)if(h.subs[i].id===id)return h.subs[i];return null}
/* The tag of a question, if it still points at an existing heading. */
function tagOf(qid){
  var t=store.tags[qid];if(!t)return null;
  var h=findHeading(t.h);if(!h)return null;
  var sb=t.s?findSub(h,t.s):null;
  return {h:h,s:sb,label:h.t+(sb?" › "+sb.t:"")};
}
function questionById(id){var Q=QUESTIONS.concat(store.custom);for(var i=0;i<Q.length;i++)if(Q[i].id===id)return Q[i];return null}
function taggedTo(hid,sid){
  return Object.keys(store.tags).filter(function(q){var t=store.tags[q];return t.h===hid&&(t.s||"")===(sid||"")})
    .map(questionById).filter(Boolean);
}
/* Sheet rows: one per subheading, or one per heading that has none. */
function toSheetNotes(notes){
  var rows=[],order=0;
  notes.forEach(function(h){
    if(!h.subs.length)rows.push({headingId:h.id,heading:h.t,subId:"",subheading:"",order:order++,body:"",images:[]});
    h.subs.forEach(function(sb){
      rows.push({headingId:h.id,heading:h.t,subId:sb.id,subheading:sb.t,order:order++,body:sb.b||"",
        images:(sb.imgs||[]).filter(function(im){return im.d})});
    });
  });
  return rows;
}
function fromSheetNotes(rows){
  var out=[],byId={};
  rows.slice().sort(function(a,b){return a.order-b.order}).forEach(function(r){
    var h=byId[r.headingId];
    if(!h){h=byId[r.headingId]={id:r.headingId,t:r.heading,subs:[]};out.push(h)}
    if(r.subId)h.subs.push({id:r.subId,t:r.subheading,b:r.body||"",imgs:Array.isArray(r.images)?r.images:[]});
  });
  return out;
}
/* Small markdown: blank line = paragraph, "- " = bullet, `code`, **bold**. */
function noteHtml(b){
  return String(b||"").split(/\n\s*\n/).map(function(block){
    var lines=block.split("\n");
    var inl=function(t){return fmt(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")};
    if(lines.every(function(l){return /^\s*[-*] /.test(l)||!l.trim()}))
      return '<ul>'+lines.filter(function(l){return l.trim()}).map(function(l){return '<li>'+inl(l.replace(/^\s*[-*] /,""))+'</li>'}).join("")+'</ul>';
    return '<p>'+lines.map(inl).join("<br>")+'</p>';
  }).join("");
}
function imgSrc(im){
  if(im.d&&/^[\w-]+$/.test(im.d))return "https://drive.google.com/thumbnail?id="+im.d+"&sz=w1600";
  if(im.src&&/^data:image\//.test(im.src))return im.src;
  return "";
}
function imgHtml(im,editIdx){
  var src=imgSrc(im);if(!src)return "";
  var fb=im.d?' onerror="this.onerror=null;this.src=\'https://lh3.googleusercontent.com/d/'+im.d+'\'"':'';
  var img='<img src="'+esc(src)+'" alt="Notes picture" loading="lazy"'+fb+'>';
  if(editIdx!=null)return '<span class="ed">'+img+'<button type="button" data-nimgdel="'+editIdx+'" aria-label="Remove picture">Remove</button></span>';

/* Shrink a picture in the browser before storing it. Resolves to {mime, data (base64), url}. */
function shrinkImage(file,maxSide,quality){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var k=Math.min(1,maxSide/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      var c=document.createElement("canvas");c.width=w;c.height=h;
      var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      var du=c.toDataURL("image/jpeg",quality);
      resolve({mime:"image/jpeg",data:du.split(",")[1],url:du});
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("That file could not be read as a picture."))};
    img.src=url;
  });
}
function addPicture(file){
  var st=document.getElementById("nd-up"),err=document.getElementById("nd-err"),d=noteDraft;
  if(!d)return;
  if(err)err.textContent="";
  if(localUser&&SHEETS_URL&&sheetV>0&&sheetV<3){if(err)err.textContent="Pictures need the latest Apps Script. Redeploy it as described in SHEETS_SETUP.md.";return}
  if(st)st.textContent="Adding picture...";
  var cloud=localUser&&SHEETS_URL;
  shrinkImage(file,cloud?1600:1000,cloud?0.85:0.72).then(function(img){
    if(!cloud)return {src:img.url};
    return uploadImage(localUser,file.name,img).then(function(id){return {d:id}});
  }).then(function(im){
    if(noteDraft!==d)return;
    d.imgs.push(im);drawImgs();if(st)st.textContent="";
  }).catch(function(e){
    if(st)st.textContent="";
    var el=document.getElementById("nd-err");if(el)el.textContent="Could not add the picture: "+(e&&e.message||e);
  });
}
function uploadImage(username,name,img){
  return fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"upload",username:username,name:name,mime:img.mime,data:img.data})})
    .then(function(r){return r.json()})
    .then(function(j){sheetV=+j.v||1;if(!j.ok)throw new Error(j.error||"upload failed");return j.id});
}
function notesClick(e){

  if(a("data-npractice")){
    var ids=a("data-npractice").split(","),qs=ids.map(questionById).filter(Boolean);
    noteDraft=null;noteRename=null;if(qs.length)begin("Notes practice",shuffle(qs));return;
  }
  if(a("data-naddh")){
    var h={id:nid("h"),t:"New heading",subs:[]};store.notes.push(h);save();
    noteRename=h.id;noteDraft=null;rerenderNotes("nh-"+h.id);
    var r=document.getElementById("nr-t");if(r){r.focus();r.select()}
    return;
  }
  if(a("data-nrename")){noteRename=a("data-nrename");noteDraft=null;rerenderNotes();var r2=document.getElementById("nr-t");if(r2){r2.focus();r2.select()}return}
  if(a("data-nrcancel")){noteRename=null;rerenderNotes();return}
  if(a("data-nrsave")){
    var hh=findHeading(a("data-nrsave")),v=(document.getElementById("nr-t").value||"").trim();
    if(hh&&v){hh.t=v;save()}
    noteRename=null;rerenderNotes(hh?"nh-"+hh.id:null);return;
  }
  if(a("data-ndelh")){
    var id=a("data-ndelh");
    if(noteRename!=="del:"+id){noteRename="del:"+id;rerenderNotes();return}
    store.notes=store.notes.filter(function(x){return x.id!==id});
    Object.keys(store.tags).forEach(function(q){if(store.tags[q].h===id)delete store.tags[q]});
    noteRename=null;save();rerenderNotes();return;
  }
  if(a("data-naddsub")){
    var h2=findHeading(a("data-naddsub"));if(!h2)return;
    var sb={id:nid("s"),t:"New subheading",b:"",imgs:[]};h2.subs.push(sb);save();
    noteDraft={h:h2.id,s:sb.id,t:sb.t,b:"",imgs:[]};noteRename=null;rerenderNotes("ns-"+sb.id);
    var t=document.getElementById("nd-t");if(t){t.focus();t.select()}
    return;
  }
  if(a("data-nedit")){
    var p=a("data-nedit").split("|"),h3=findHeading(p[0]),s3=findSub(h3,p[1]);if(!s3)return;
    noteDraft={h:h3.id,s:s3.id,t:s3.t,b:s3.b||"",imgs:(s3.imgs||[]).slice()};noteRename=null;rerenderNotes("ns-"+s3.id);return;
  }
  if(a("data-ndels")){
    var p2=a("data-ndels").split("|"),h4=findHeading(p2[0]);if(!h4)return;
    if(noteRename!=="del:"+p2[1]){noteRename="del:"+p2[1];rerenderNotes();return}
    h4.subs=h4.subs.filter(function(x){return x.id!==p2[1]});
    Object.keys(store.tags).forEach(function(q){if(store.tags[q].s===p2[1])store.tags[q].s=""});
    noteRename=null;save();rerenderNotes("nh-"+h4.id);return;
  }
  if(a("data-nimgdel")!=null&&noteDraft){noteDraft.imgs.splice(+a("data-nimgdel"),1);drawImgs();return}
  if(a("data-ncancel")){var sid=noteDraft&&noteDraft.s;noteDraft=null;rerenderNotes(sid?"ns-"+sid:null);return}

/* ---------- Google Sheets API (Apps Script Web App) ---------- */
/* Fetch one user's row. Resolves to the stored data, or null if the user has no row yet. */
function loadProgress(username){
  if(!SHEETS_URL)return Promise.reject(new Error("SHEETS_URL is not set"));
  return fetch(SHEETS_URL+"?username="+encodeURIComponent(username),{cache:"no-store"})
    .then(function(r){return r.json()})
    .then(function(j){sheetV=+j.v||1;if(!j.ok)throw new Error(j.error||"load failed");return j.found?j.data:null});
}
/* Create or update one user's row. text/plain avoids a CORS preflight, which Apps Script cannot answer. */
function saveProgress(username,data,opts){
  if(!SHEETS_URL)return Promise.reject(new Error("SHEETS_URL is not set"));
  return fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({username:username,data:data}),keepalive:!!(opts&&opts.keepalive)})
    .then(function(r){return r.json()})
    .then(function(j){sheetV=+j.v||1;if(!j.ok)throw new Error(j.error||"save failed");return j});
}
/* Question bank <-> Questions tab rows. The correct answer is always o[0]. */
function examOf(sid){var ks=Object.keys(EXAMS);for(var k=0;k<ks.length;k++){var ss=EXAMS[ks[k]].sections;for(var i=0;i<ss.length;i++)if(ss[i].id===sid)return ks[k]}return "pro"}
function toSheetQuestion(c){
  var o=c.o||[];
  return {id:c.id,exam:examOf(c.s),sectionId:c.s,sectionName:SEC[c.s]?SEC[c.s].name:c.s,question:c.q,code:c.c||"",
    correct:o[0]||"",option2:o[1]||"",option3:o[2]||"",option4:o[3]||"",explanation:c.e||"",seenInExam:!!store.exam[c.id]};
}
function fromSheetQuestion(r){
  var rec={id:r.id,s:SECMAP[r.sectionId]||r.sectionId,q:r.question,
    o:[r.correct,r.option2,r.option3,r.option4].filter(function(x){return x!==""&&x!=null}),e:r.explanation||"",custom:true};
  if(r.code)rec.c=r.code;
  return rec;
}
var sheetV=0; /* what the deployed script supports: 2 = Questions tab, 3 = Notes tab, pictures and the group dashboard. Older scripts keep those inside State */
var syncedBank=null,syncedNotes=null; /* as last confirmed in the sheet; only resend when they change */
function bankSig(){return JSON.stringify([store.custom,store.custom.map(function(c){return !!store.exam[c.id]})])}
function notesSig(){return JSON.stringify(store.notes)}
/* The row written for the current user: summary columns for reading the sheet, plus the full state for syncing. */
function progressData(){
  var st=store.stats,answered=0,correct=0;
  Object.keys(st).forEach(function(id){answered++;if(st[id]&&st[id].ok)correct++});
  function secs(sections){
    var r={},x=examSummary(sections).sec;
    Object.keys(x).forEach(function(k){r[k]={correct:x[k].ok,answered:x[k].n,total:x[k].t}});
    return r;
  }
  return {totalAnswered:answered,totalCorrect:correct,
    sectionScores:{pro:secs(PRO_SECTIONS),assoc:secs(ASSOC_SECTIONS),spark:secs(SPARK_SECTIONS),
      mock:{pro:numOrNull(store.mockBest),assoc:numOrNull(store.mockBestA),spark:numOrNull(store.mockBestS)}},
    mockBestPro:typeof store.mockBest==="number"?store.mockBest:null,
    mockBestAssoc:typeof store.mockBestA==="number"?store.mockBestA:null,
    lastUpdated:store.updated||Date.now(),state:stateOnly()};
}
function numOrNull(n){return typeof n==="number"?n:null}
function stateOnly(){
  var o={};
  Object.keys(store).forEach(function(k){if(!(k==="custom"&&sheetV>=2)&&!(k==="notes"&&sheetV>=3))o[k]=store[k]});
  return o;
}
var sheetPending=false,sheetBusy=false,sheetTimer=null;
function sheetFlush(keepalive){
  clearTimeout(sheetTimer);sheetTimer=null;
  if(!localUser||!SHEETS_URL||!sheetPending)return;
  if(sheetBusy){sheetTimer=setTimeout(sheetFlush,800);return}
  sheetPending=false;sheetBusy=true;
  var who=localUser,data=progressData(),sig=bankSig(),nsig=notesSig();
  if(sheetV>=2&&sig!==syncedBank)data.questions=store.custom.map(toSheetQuestion);
  if(sheetV>=3&&nsig!==syncedNotes)data.notes=toSheetNotes(store.notes);
  saveProgress(who,data,{keepalive:keepalive}).then(function(res){
    if(res.stale&&who===localUser)return pullSheet();
    if(who===localUser&&data.questions)syncedBank=sig;
    if(who===localUser&&data.notes)syncedNotes=nsig;
    syncState="sheet";setNote();
  }).catch(function(){sheetPending=true;syncState="error";setNote()})
    .then(function(){sheetBusy=false});
}
/* Take the sheet copy if it is newer than this browser's, otherwise push ours up. */
function pullSheet(){
  if(!localUser||!SHEETS_URL)return Promise.resolve();
  var who=localUser;
  if(syncState!=="sheet"){syncState="syncing";setNote()}
  return loadProgress(who).then(function(remote){
    if(who!==localUser)return;
    if(remote&&remote.state&&typeof remote.state==="object"&&(remote.lastUpdated||0)>(store.updated||0)){
      store=remote.state;store.updated=remote.lastUpdated;
      /* questions live in their own tab; rows saved before that existed keep them inside state */
      if(Array.isArray(remote.questions))store.custom=remote.questions.map(fromSheetQuestion);
      if(Array.isArray(remote.notes))store.notes=fromSheetNotes(remote.notes);
      norm();setExam(store.which);
      syncedBank=Array.isArray(remote.questions)?bankSig():null;
      syncedNotes=Array.isArray(remote.notes)?notesSig():null;
      /* rows saved by an older script keep these inside State; move them into their own tabs */
      if((!syncedBank&&store.custom.length)||(!syncedNotes&&store.notes.length)){sheetPending=true;setTimeout(sheetFlush,0)}
      writeJSON(KEY,store);
      if(view==="home")home();else if(view==="bank")bank();else if(view==="notes")notesPage();
    }else if(hasContent()&&(!remote||(store.updated||0)>(remote.lastUpdated||0))){
      sheetPending=true;sheetFlush();
    }
    syncState="sheet";setNote();
  }).catch(function(){if(who===localUser){syncState="error";setNote()}});
}
document.addEventListener("visibilitychange",function(){
  if(!localUser||!SHEETS_URL)return;
  if(document.visibilityState==="hidden")sheetFlush(true);
  else if(!ses&&!sheetPending&&!noteDraft&&!noteRename)pullSheet();
});

}
function useName(n){
  n=cleanName(n);if(!n){askName();return}
  var first=!localNames().length;
  localUser=n;KEY=BASEKEY+":u:"+n;
  try{localStorage.setItem(CUR_KEY,n)}catch(e){}
  if(first&&!readJSON(KEY)){var legacy=readJSON(BASEKEY);if(legacy)writeJSON(KEY,legacy)}
  store=load();norm();setExam(store.which);
  syncState="local";sheetPending=false;syncedBank=null;syncedNotes=null;
  home();
  if(SHEETS_URL)pullSheet();
}
function signOut(){
  sheetFlush(true);
  try{localStorage.removeItem(CUR_KEY)}catch(e){}
  var name=localUser;localUser=null;KEY=BASEKEY;store={};norm();syncState="local";
  askName(name);
}

if(HOSTED){home();connect()}
else{
  migrateLocal();
  var cur=null;try{cur=localStorage.getItem(CUR_KEY)}catch(e){}
  cur=cleanName(cur);
  if(cur)useName(cur);else askName();
}
})();
</script>
