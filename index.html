<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Practice quiz for the Databricks Certified Data Engineer Professional and Associate exams.">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lakehouse Pro Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Sticker-style UI: flat bright fills, thick ink borders, hard offset shadows. Each exam section owns one colour (--c) that follows it everywhere. */
:root{
  --bg:#EAF4FF; --surface:#FFFFFF; --ink:#14123A; --muted:#4D4B78; --line:#C3D2EC; --edge:#14123A; --dots:#B7C9E8;
  --pink:#FF3D8B; --yellow:#FFD21F; --cyan:#19D3EE; --lime:#9BEA2B; --orange:#FF7A1A; --violet:#B28BFF; --blue:#2F6BFF;
  --mint:#3EE8B5; --on:#14123A; --focus:#2F6BFF;
  --good:#0B7A3B; --bad:#D4145A; --code-bg:#FFEE8C; --code-ink:#14123A;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13103A; --surface:#1F1B5A; --ink:#F6F4FF; --muted:#BDB8F2; --line:#3B3790; --edge:#A9A2FF; --dots:#272370;
    --focus:#19D3EE; --good:#8DF04A; --bad:#FF7AAE; --code-bg:#3A3490; --code-ink:#FFF3A8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13103A; --surface:#1F1B5A; --ink:#F6F4FF; --muted:#BDB8F2; --line:#3B3790; --edge:#A9A2FF; --dots:#272370;
  --focus:#19D3EE; --good:#8DF04A; --bad:#FF7AAE; --code-bg:#3A3490; --code-ink:#FFF3A8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dots) 1.3px,transparent 1.3px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  padding-block:30px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:740px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(2.5rem,10vw,4.6rem);font-weight:800;letter-spacing:-.03em;line-height:1}
h2{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;line-height:1.25}
p{margin:0}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);color:var(--code-ink);padding:.08em .38em;border-radius:5px}
.label{font-family:var(--mono);font-size:.74rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;background:var(--c,var(--cyan));color:var(--on);border:2px solid var(--edge);border-radius:99px;padding:3px 12px;font-weight:700}
.hl{display:inline-block;background:var(--yellow);color:var(--on);padding:0 .16em;border:3px solid var(--edge);border-radius:12px;box-shadow:4px 4px 0 var(--edge);transform:rotate(-2.5deg)}
.lede{color:var(--muted);max-width:60ch;margin-top:16px;font-size:1.02rem}
.small{font-size:.86rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.btn{border:2px solid var(--edge);background:var(--surface);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:700;font-size:.95rem;box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--edge)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--pink);color:var(--on)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.link{border:0;box-shadow:none;background:none;padding:6px 0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:600;color:var(--ink);transition:none}
.btn.link:hover{transform:none;box-shadow:none;color:var(--pink)}

/* home */
.seg{display:inline-flex;margin-top:20px;border:2px solid var(--edge);border-radius:99px;background:var(--surface);box-shadow:3px 3px 0 var(--edge);padding:3px;gap:3px}
.segbtn{border:0;background:transparent;border-radius:99px;padding:8px 20px;font-weight:800;color:var(--ink)}
.segbtn:hover:not([aria-pressed="true"]){background:var(--code-bg);color:var(--code-ink)}
.segbtn[aria-pressed="true"]{background:var(--yellow);color:var(--on)}
.w{font-family:var(--mono);font-size:.72rem;font-weight:700;background:var(--c,var(--pink));color:var(--on);border:2px solid var(--edge);border-radius:99px;padding:0 8px;margin-left:8px;vertical-align:1px}
.blue{display:flex;height:36px;border:2px solid var(--edge);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--edge);margin-top:14px}
.blue span{display:grid;place-items:center;min-width:0;font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--on);border-right:2px solid var(--edge)}
.blue span:last-child{border-right:0}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.stat{flex:1 1 120px;padding:10px 14px;border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--edge);color:var(--on)}
.stat:nth-child(1){background:var(--pink)} .stat:nth-child(2){background:var(--cyan)}
.stat:nth-child(3){background:var(--yellow)} .stat:nth-child(4){background:var(--lime)}
.stat b{font-family:var(--display);font-size:1.9rem;font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .small{color:var(--on);font-weight:500}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:38px}
.sec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:13px 0;border-bottom:2px dashed var(--line);cursor:pointer}
.sec input{width:20px;height:20px;accent-color:var(--c,var(--pink));margin:0}
.sec .name{font-weight:700}
.sec .name::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c,var(--pink));border:2px solid var(--edge);margin-right:8px;vertical-align:-1px}
.sec .blurb{font-size:.86rem;color:var(--muted)}
.sec .num{font-family:var(--mono);font-size:.82rem;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.bar{grid-column:2 / 4;height:9px;background:var(--surface);border:2px solid var(--edge);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--lime))}
.controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-top:24px}
.controls select{font:inherit;font-weight:600;background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:8px 10px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:22px}
.mode{border:2px solid var(--edge);background:var(--c,var(--yellow));color:var(--on);border-radius:18px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:5px 5px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.mode:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--edge)}
.mode:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
.mode strong{font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1.15}
.mode span{font-size:.88rem;color:var(--on)}
.mode .go{font-family:var(--mono);font-size:.78rem;font-weight:700;margin-top:6px}
.err{color:var(--bad);min-height:1.4em;margin-top:12px;font-size:.95rem;font-weight:600}
.hist{margin:10px 0 0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px dashed var(--line);font-size:.92rem}
.hist .num{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}

/* quiz */
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.topbar .left{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.timer{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem;background:var(--yellow);color:var(--on);border:2px solid var(--edge);border-radius:99px;padding:3px 12px}
.timer.low{background:var(--pink)}
.prog{height:12px;margin-top:14px;background:var(--surface);border:2px solid var(--edge);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,var(--orange) 10px 20px);transition:width .25s}
.qcard{margin-top:20px;background:var(--surface);border:2px solid var(--edge);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--edge)}
.qtext{margin-top:14px;font-size:1.35rem;line-height:1.3;font-weight:800}
pre.code{margin:18px 0 0;padding:14px 16px;background:#14123A;color:#EDEBFF;border:2px solid var(--edge);border-radius:12px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;line-height:1.6}
pre.code code{background:none;color:inherit;padding:0;font-size:inherit}
.opts{display:grid;gap:12px;margin-top:22px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;padding:12px 14px;border:2px solid var(--edge);background:var(--surface);border-radius:14px;box-shadow:3px 3px 0 var(--edge);transition:transform .1s,box-shadow .1s,background .1s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--edge)}
.opt .k{font-family:var(--mono);font-weight:700;font-size:.85rem;width:28px;height:28px;border:2px solid var(--edge);border-radius:8px;display:grid;place-items:center;color:var(--on)}
.opt:nth-child(1) .k{background:var(--pink)} .opt:nth-child(2) .k{background:var(--cyan)}
.opt:nth-child(3) .k{background:var(--yellow)} .opt:nth-child(4) .k{background:var(--lime)}
.opt .t{overflow-wrap:anywhere;padding-top:2px}
.opt.sel{background:var(--yellow);color:var(--on)}
.opt.ok{background:var(--lime);color:var(--on)}
.opt.no{background:var(--pink);color:var(--on)}
.opt.ok .k,.opt.no .k,.opt.sel .k{background:var(--surface);color:#14123A}
.opt[disabled]{cursor:default;box-shadow:3px 3px 0 var(--edge)}
.opt.dim{opacity:.55}
.fb{margin-top:18px}
.fb:not(:empty){background:var(--code-bg);color:var(--code-ink);border:2px solid var(--edge);border-radius:14px;padding:12px 14px}
.fb .verdict{font-weight:800;font-family:var(--display);font-size:1.1rem}
.fb .verdict.ok{color:var(--good)}
.fb .verdict.no{color:var(--bad)}
.fb p{margin-top:6px;max-width:62ch}
.actions{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}

/* results */
.score{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,18vw,7rem);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--pink);text-shadow:5px 5px 0 var(--edge);-webkit-text-stroke:2px var(--edge)}
.brk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px 14px;align-items:center;margin-top:12px}
.brk .bar{grid-column:auto;height:12px}
.rev{margin-top:12px;border-top:2px dashed var(--line)}
.rev details{border-bottom:2px dashed var(--line);padding:12px 0}
.rev summary{cursor:pointer;font-weight:600}
.rev .body{margin-top:10px}
.rev .ans{margin-top:8px;font-size:.92rem}
.rev .ans b{font-weight:700}
.good{color:var(--good)} .badc{color:var(--bad)}

/* question bank */
.flag{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 13px 4px 7px;font-size:.84rem;font-weight:600;white-space:nowrap;box-shadow:2px 2px 0 var(--edge)}
.flag:hover{background:var(--code-bg);color:var(--code-ink)}
.flag .box{width:18px;height:18px;border:2px solid var(--edge);border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;line-height:1;background:var(--surface);color:var(--on)}
.flag[aria-pressed="true"]{background:var(--yellow);color:var(--on)}
.flag[aria-pressed="true"] .box{background:var(--lime)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.tab{border:2px solid var(--edge);background:var(--surface);color:var(--ink);padding:7px 15px;font-weight:700;border-radius:99px;box-shadow:2px 2px 0 var(--edge)}
.tab[aria-selected="true"]{background:var(--pink);color:var(--on)}
.field{display:grid;gap:6px;margin-top:16px}
.field label,.field .lbl{font-size:.86rem;font-weight:700}
.field input[type=text],.field input[type=search],.field textarea,.field select{font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px}
.field textarea.mono{font-family:var(--mono);font-size:.84rem}
.optrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.optrow input[type=radio]{accent-color:var(--pink);width:20px;height:20px;margin:0}
.qrow{display:grid;gap:8px;padding:14px 0;border-bottom:2px dashed var(--line)}
.qrow .qt{overflow-wrap:anywhere}
.qrow .meta{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qrow .rowact{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:.7rem;font-weight:700;background:var(--violet);color:var(--on);border:2px solid var(--edge);border-radius:99px;padding:0 8px;margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.login{max-width:440px}
.login .field input[type=password]{font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.profiles{margin-top:10px;border-top:1px solid var(--line)}
.profile{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;color:var(--ink);font:inherit}
.profile:hover{background:var(--code-bg);color:var(--code-ink)}
.profile b{font-weight:700}
.profile .num{font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums}
.userbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:14px;font-size:.92rem}
.ok-note{color:var(--good);font-size:.92rem;font-weight:700}

/* notes */
.ntag{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:2px solid var(--edge);background:var(--violet);color:var(--on);border-radius:99px;padding:3px 12px;font-size:.84rem;font-weight:700;box-shadow:2px 2px 0 var(--edge);text-align:left;overflow-wrap:anywhere}
.ntag:hover{background:var(--code-bg);color:var(--code-ink)}
.ntag.empty{background:var(--surface);color:var(--ink);font-weight:600}
.tagrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
.tagpanel{margin-top:12px;padding:12px 14px;border:2px dashed var(--edge);border-radius:14px;background:var(--bg)}
.tagpanel .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.ntoc{margin-top:18px;padding:12px 16px;border:2px solid var(--edge);border-radius:14px;background:var(--surface);box-shadow:3px 3px 0 var(--edge)}
.ntoc ul{list-style:none;margin:6px 0 0;padding:0}
.ntoc ul ul{margin:2px 0 4px 16px}
.ntoc button{background:none;border:0;padding:3px 0;text-align:left;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ntoc ul ul button{font-weight:500;color:var(--muted)}
.ntoc button:hover{color:var(--pink)}
.nhead{margin-top:30px;scroll-margin-top:20px}
.nhead>.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap;border-bottom:3px solid var(--edge);padding-bottom:6px}
.nhead h2{font-size:1.5rem}
.note{margin-top:14px;padding:14px 16px;background:var(--surface);border:2px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--edge);scroll-margin-top:20px}
.note h3{font-size:1.1rem;font-weight:800}
.nbody{margin-top:8px;overflow-wrap:anywhere}
.nbody p+p,.nbody ul{margin-top:8px}
.nbody ul{padding-left:20px}
.nimgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.nimgs a,.nimgs .ed{display:block;border:2px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--bg);position:relative}
.nimgs img{display:block;max-height:220px;max-width:100%;width:auto}
.nimgs .ed img{max-height:120px}
.nimgs .ed button{position:absolute;top:4px;right:4px;border:2px solid var(--edge);background:var(--pink);color:var(--on);border-radius:8px;font-size:.75rem;font-weight:700;padding:0 6px}
.nacts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.nq{margin-top:10px;font-size:.9rem}
.nq summary{cursor:pointer;font-weight:600;color:var(--muted)}
.nq li{margin-top:6px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 5px var(--yellow),4px 4px 0 var(--edge)}100%{box-shadow:4px 4px 0 var(--edge)}}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
.overlay .closebar{position:sticky;top:-24px;z-index:1;display:flex;justify-content:flex-end;padding:10px 0;background:var(--bg)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:24px}
.kpi{padding:12px 14px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--edge)}
.kpi b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
.insights{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.insights li{padding:10px 14px;background:var(--surface);border:2px solid var(--edge);border-left-width:8px;border-radius:12px}
.panel{margin-top:14px;background:var(--surface);border:2px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--edge);overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:.9rem}
.dt th,.dt td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.dt th{font-size:.74rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
.dt tr:last-child td{border-bottom:0}
.dt td.n,.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
.dt tr.me td{background:var(--code-bg);color:var(--code-ink)}
.mbar{display:inline-block;vertical-align:middle;width:70px;height:8px;margin-right:8px;background:var(--line);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:.82rem;border:2px solid var(--surface);border-radius:6px;min-width:52px}
.heat th.c{text-align:center}
.legend{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.82rem;color:var(--muted)}
.legend .ramp{width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 6%,var(--surface)),var(--blue))}
.sbars{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px 14px;align-items:center;padding:14px 16px}
.sbars .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.sbars .track i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.sbars .v{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right}
/* group progress */
.grow{border-bottom:2px dashed var(--line)}
.grow summary{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;list-style:none;padding:13px 0}
.grow summary::-webkit-details-marker{display:none}
.grow summary .bar{grid-column:auto;height:12px}
.grow summary .bar i{background:var(--pink)}
.grow .num{font-family:var(--mono);font-size:.84rem;font-weight:500;font-variant-numeric:tabular-nums}
.gname{font-weight:700;overflow-wrap:anywhere}
.gdet{padding:0 0 16px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--edge);margin-right:8px;vertical-align:-1px}
.dot.on{background:var(--lime);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--lime)}
@media (max-width:480px){.qcard{padding:16px;border-radius:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

(function(){
"use strict";

var PRO_SECTIONS=[
  {id:"dev",name:"Developing code",w:23,n:14,blurb:"Python and SQL, Lakeflow Pipelines and Jobs, CDC, stateful streaming, testing"},
  {id:"ing",name:"Ingestion and acquisition",w:12,n:7,blurb:"Auto Loader, Kafka, Lakeflow Connect CDC, Delta Sharing, Clean Rooms, Federation"},
  {id:"man",name:"Data manipulation",w:12,n:7,blurb:"Windows, joins, MERGE, VARIANT, AI functions, expectations"},
